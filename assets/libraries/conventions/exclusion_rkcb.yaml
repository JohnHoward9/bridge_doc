        rule: "kc<=1 h"
        priority: 2
      6h:
        desc: "Small slam in 6H"
        rule: "kc>=2 h"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try"
        rule: "kc=2 h"
        priority: 1
        ref: "fSpecificKingResponses"
      7h:
        desc: "Grand slam in Hearts"
        rule: "kc=2 h"
        priority: 2

  # --- Exclusion RKCB for Spades ---
  fExclusionRKCB_Spades:
    desc: "Exclusion RKCB for Spades (void in bid suit, asking for key cards outside void)"
    bids:
      5c:
        forceTo: slam
        desc: "Exclusion RKCB: Club void, asks for key cards excluding CA"
        rule: "0c 16+hcp [$void=c]"
        priority: 1
        bids:
          5d:
            desc: "0 or 3 Key Cards (excluding CA)"
            rule: "kc=0|3:s"
            priority: 1
            include: "fExclusionCaptainStep1_Spades"
          5h:
            desc: "1 or 4 Key Cards (excluding CA)"
            rule: "kc=1|4:s"
            priority: 1
            include: "fExclusionCaptainStep2_Spades"
          5s:
            desc: "2 Key Cards without Queen of Spades"
            rule: "kc=2-q:s"
            priority: 1
            include: "fExclusionCaptainStep3_Spades"
          5nt:
            desc: "2 Key Cards with Queen of Spades"
            rule: "kc=2+q:s"
            priority: 1
            include: "fExclusionCaptainStep4_Spades"

      5d:
