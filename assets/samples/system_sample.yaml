system: "3-Way club 5 card Majors"
player: "John"
partner: "Andy"

definitions:
  bal: "s#5332|4432|4333"
  weakbal: "11-14hcp $bal 4-h 4-s"
  strongnt: "15-17hcp $bal 4-h 4-s"
  gf: "23+hcp $bal, 27+knr"
  11to12Bal: "11-12hcp $bal 4-h 4-s"
  13PlusBal: "13+hcp $bal 4-h 4-s"
  14to15Bal: "14-15hcp $bal 4-h 4-s"
  16PlusBal: "16+hcp $bal 4-h 4-s"
  16to17Bal: "16-17hcp $bal 4-h 4-s"
  18PlusBal: "18+hcp $bal 4-h 4-s"
  17to18Bal: "17-18hcp $bal 4-h 4-s"
  19PlusBal: "19+hcp $bal 4-h 4-s"

# Tree of auctions initiated by our side
OpeningBids:
  pass:
    desc: "No opening available"
    rule: "10-hcp"
    bids:
      "[1h-1s]":
        desc: "5 card major opening"
        rule: "1h:5+h 11+hcp [$M=h, $OM=s, $os=h] ^ 1s:5+s 11+hcp [$M=s, $OM=h, $os=s]"
        priority: 5
        bids:
          2c:
            desc: "Drury 3-4"
            rule: "9+hcp 3+$M"
            bids:
              2d:
                desc: "Length enquiry"
                rule: "14+hcp"
                bids:
                  "2$M":
                    desc: "3 major"
                    rule: "3$M"
                    priority: 3
                  "3$M":
                    desc: "4 major"
                    rule: "4$M"
                    priority: 3
              "2$M":
                desc: "Minimum"
                rule: "13-hcp"
          4h:
            desc: "Fit"
            rule: "4+s 5+h"
            cond: "$os=s"
      "(50%Weak.1nt)":
        desc: "Weak NT"
        rule: "12-14hcp"
        bids:
          pass:
            desc: "Not enough to compete"
            bids:
              dbl:
                desc: "4M 5+m"
                rule: "d#4xx5|4xx6|4x5x|4x6x|x4x5|x4x6|x45x|x46x 8-11hcp"
                priority: 1
              "~>MultiLandy":
                priority: 3
                ref: "fMultiLandy"
      "(50%Strong.1nt)":
        desc: "Strong NT"
        rule: "15-17hcp"

  1c:
    desc: "3 way club"
    rule: "$weakbal, 5+c 11+hcp c>* !$bal, s#4441 4c 11-14hcp, $gf [$os=c]"
    priority: 2
    bids:
      "[1d-1h]":
        desc: "xfer response showing 4+M"
        rule: "1d:4+h h>s, 4h 4s [$M=h, $OM=s] ^ 1h:4+s [$M=s,$OM=h]"
        priority: 4
        bids:
          "~>Initial gf":
            rule: "$gf"
            priority: 1
            ref: "f1CMajorGameForcing"
          "~>Support":
            rule: "3+$M"
            priority: 4
            bids:
              "~>Strong hand 3/4 card support":
                rule: "17+hcp 5+c !s#5332"
                ref: "f1CMajorStrongSupport"
              "~>Limited hand 3/4 card support":
                rule: "16-hcp"
                ref: "f1CMajorLimitedSupport"
          "~>No Support":
            rule: "2-$M"
            priority: 5
            bids:
              "~>Spades no support":
                rule: "4+s"
                priority: 3
                ref: "f1CMajorSpadeHands"
              "~>Strong hand no support":
                rule: "17+hcp s#55xx|54xx|64xx, 18+hcp s#6322, 19+hcp 6+c"
                priority: 3
                ref: "f1CMajorStrongHands"
              1nt:
                desc: "Weak nt no support"
                rule: "$weakbal, s#4441|5431 c>=* 11-14hcp 1$M"
                priority: 5
                ref: "f1CMajorWeakNT"
              2c:
                desc: "Clubs"
                rule: "15-hcp 5+c !s#5332"
                priority: 4
                ref: "f1CMajorClubs"
              3c:
                desc: "Clubs natural inv"
                rule: "16-17hcp 6+c"
                priority: 1
          3d:
            desc: "splinter 18+"
            rule: "1-d 18-21hcp 4$M"
            priority: 1
          "3$OM":
            desc: "splinter 18+"
            rule: "1-$OM 18-21hcp 4$M"
            priority: 1
          "(1s)":
            desc: "Overcall"
            rule: "5+s 7+hcp"
            cond: "$M=h"
            bids:
              2d:
                desc: "Reverse"
                rule: "16+hcp 5+c 4+d c>d"
                priority: 1
              2s:
                desc: "Initial GF"
                rule: "$gf"
                priority: 1
      1s:
        desc: "GF diamonds or <10hcp no 4c M"
        rule: "13+hcp 5+d d>*, 10-hcp 3-h 3-s"
        priority: 3
        bids:
          1nt:
            desc: "11-14 Bal"
            rule: "$weakbal"
            priority: 4
            bids:
              2c:
                desc: "natural sign off"
                rule: "5+c 9-hcp"
                priority: 1
              2d:
                desc: "natural sign off"
                rule: "5+d 9-hcp"
                priority: 1
              "[2h,2s]":
                desc: "natural GF diamonds"
                rule: "2h:12+hcp 5+d 4+h d>h ^ 2s:12+hcp 5+d 4+s d>s"
                priority: 2
              2nt:
                desc: "natural gf"
                rule: "5+d 13+hcp s#5332|6322"
                priority: 2
              3c:
                desc: "natural gf"
                rule: "12+hcp 5+d 4+c d>c"
                priority: 2
              3d:
                desc: "natural gf"
                rule: "6+d 13+hcp 3-s 3-h 3-c"
                priority: 2

  1d:
    desc: "Unbalanced"
    rule: "5+d d>s d>h !s#5332 11+hcp, 4d s#4441 11+hcp 3-c [$os=d]"
    priority: 3

  1nt:
    desc: "Strong NT"
    rule: "15-17hcp s#4333|4432|5332|4441, 14-16hcp s#5422 4-s 4-h, 13-15hcp s#6322 4-s 4-h"
    priority: 3

  2c:
    desc: "Majors 8-13"
    rule: "s#55xx 4+h 4+s 8-11hcp, s#5431 4+h 4+s 8-12hcp, s#5422 4+h 4+s 8-13hcp, 4h 4s 8-12hcp"
    priority: 1

  2d:
    desc: "18-19 balanced not 5 card major"
    rule: "18-19hcp 4-h 4-s s#4333|4432|5332|4441, 17-18hcp s#5422 4-s 4-h, 16-17hcp s#6322 4-s 4-h"
    priority: 1

  2nt:
    desc: "20-22 balanced"
    rule: "20-22hcp 20+knr s#4333|4432|5332|4441, 19-21hcp s#5422 4-s 4-h, 18-20hcp s#6322 4-s 4-h"
    priority: 1

# Tree of auctions initiated by opponents
OppositionOpeningBids:
  "(50%SAYC.1c)":
    desc: "Short c"
    rule: "2+c $weakbal, 4+c 12+hcp c>=*"
    priority: 6
    bids:
      1nt:
        desc: "Minors"
        rule: "4+c 4+d s#54xx|55xx 9-14hcp"

  "(25%Acol.1c)":
    desc: "ACOL"
    rule: "4+c 12+hcp c>=* !$bal, 4+c 15+hcp c>=*"
    priority: 6

  "(25%TwoWay.1c)":
    desc: "Polish"
    rule: "2+c $weakbal, 16+hcp"
    priority: 6

  "(1d)":
    desc: "Natural"
    rule: "4+d 12+hcp d>=*"
    priority: 5
    bids:
      pass:
        desc: "Nothing to say"
        priority: 10
        bids:
          "(1s)":
            desc: "Natural"
            rule: "4+s 5+hcp"
            bids:
              2c:
                desc: "Other 2 suits"
                rule: "5+c 5+h"
                priority: 1
              2s:
                desc: "Natural"
                rule: "6+s q#hhh+s"
                priority: 1
          "(50%Inverted.2d)":
            desc: "Inverted"
            rule: "4+d 10+hcp"
            bids:
              2nt:
                desc: "5+s 5+c"
                rule: "5+s 5+c"
                priority: 1
              3d:
                desc: "Majors"
                rule: "5+s 5+h"
                priority: 1
          "(50%Natural.2d)":
            desc: "Natural"
            rule: "4+d 5-9hcp"
            bids:
              2nt:
                desc: "Any 2 suits"
                rule: "5+s 5+c, 5+s 5+h, 5+h 5+c"
                priority: 1
              3d:
                desc: "Stop ask"
                rule: "5+s 5+h"
                priority: 1
      dbl:
        desc: "Takeout"
        rule: "12+hcp 3-d"
        priority: 5
        bids:
          "[1h,1s]":
            desc: "Natural"
            rule: "1h:9-hcp 4+h [$M=h] ^ 1s:9-hcp 4+s [$M=s]"
            bids:
              1nt:
                desc: "18-19 bal"
                rule: "18-19hcp $bal"
                bids:
                  2c:
                    desc: "Natural to play"
                    rule: "4+c c>$M"
                  "2$M":
                    desc: "Natural to play"
                    rule: "5+$M 5-hcp"
      "[1h-1s]":
        desc: "Overcall"
        rule: "1h:5+h 8+hcp h>s [$OM=s, $M=h] ^ 1s:5+s 8+hcp s>=* [$OM=h, $M=s]"
        priority: 4
        bids:
          "(pass)":
            desc: "Neutral"
            priority: 10
            bids:
              2d:
                desc: "Good 3 card raise"
                rule: "3$M 8+hcp"
                priority: 4
              2nt:
                desc: "Good raise"
                rule: "4+$M 11+hcp"
                priority: 2
              3d:
                desc: "Mixed raise"
                rule: "4$M 8-10hcp"
                priority: 2
              "3$M":
                desc: "Minimum raise"
                rule: "4$M 7-hcp"
                priority: 4
      1nt:
        desc: "15-17hcp bal"
        rule: "15-17hcp $bal"
        priority: 3
        ref: "f1NTResponsesInComp"
      2c:
        desc: "Overcall"
        rule: "6+c 8+hcp"
        priority: 4
        bids:
          "(2d)":
            desc: "Natural"
            rule: "3+d 6-9hcp"
            bids:
              2nt:
                desc: "Good raise"
                rule: "3+c 9+hcp"
                priority: 3
              3c:
                desc: "Minimum raise"
                rule: "3+c 8-hcp"
                priority: 3

  "FiveCardM.[1h-1s]":
    desc: "5 card majors"
    rule: "1h:5+h 11+hcp h>s [$oppoM=h, $OM=s] ^ 1s:5+s 11+hcp s>=* [$oppoM=s, $OM=h]"
    priority: 4
    bids:
      pass:
        desc: "Weak or unsuitable"
        priority: 6
        bids:
          1nt:
            desc: "12-16 bal"
            rule: "12-16hcp $bal"
            bids:
              2c:
                desc: "Crowhurst"
                rule: "9+hcp"
                priority: 2
              2d:
                desc: "xFer"
                rule: "5+h"
                priority: 2
              2h:
                desc: "xFer"
                rule: "5+s"
                priority: 2
          "(2$oppoM)":
            desc: "Raise"
            rule: "3$oppoM 7-10hcp"
            bids:
              3h:
                desc: "Spades and another"
                rule: "5+s 5+d, 5+s 5+c"
                cond: "$oppoM=h"
                priority: 1
              3s:
                desc: "Hearts and another"
                rule: "5+h 5+d 15+hcp, 5+h 5+c 15+hcp"
                cond: "$oppoM=s"
                priority: 1
              2nt:
                desc: "Minors (over 2H) or Any 2 suits (over 2S)"
                rule: "5+c 5+d, 5+h 5+c, 5+h 5+d"
                priority: 1

# Reusable bidding convention subroutines
Fragments:
  fMultiLandy:
    bids:
      2c:
        desc: "Both majors"
        rule: "4+h 4+s 7+hcp s#54xx|55xx"
        priority: 1
        bids:
          2d:
            desc: "Asks for longest major"
            bids:
              2h:
                desc: "Hearts longest or equal length"
                rule: "h>=s"
                bids:
                  3h:
                    desc: "Real invitation"
                    rule: "12-14 hcp 4+h"
                    priority: 1
              2s:
                desc: "Spades longest"
                rule: "s>h"
                bids:
                  3s:
                    desc: "Real invitation"
                    rule: "12-14 hcp 4+s"
                    priority: 1
          2h:
            desc: "To play"
            rule: "h>=s 8-hcp"
          2s:
            desc: "To play"
            rule: "s>h 8-hcp"
          2nt:
            desc: "Natural invite"
            rule: "12-14hcp 2-h 2-s"
            priority: 1
          "[3h,3s]":
            desc: "Constructive"
            rule: "4+% 9-11hcp"
            priority: 1
      2d:
        desc: "Single suited major"
        rule: "6+s 7+hcp, 6+h 7+hcp"
        priority: 1
        bids:
          2h:
            desc: "Pass or correct"
      2h:
        desc: "Major minor 54+"
        rule: "5h s#54xx|55xx 7+hcp 3-s"
        priority: 1
      2s:
        desc: "Major minor 54+"
        rule: "5s s#54xx|55xx 7+hcp 3-h"
        priority: 1

  f1NTResponsesInComp:
    bids:
      2c:
        desc: "4M inv+ raise or 1-suited major bad suit or 1 suited minor fg"
        rule: "4h 3-s 8+hcp, 4s 3-h 8+hcp, 6+h 12+hcp q#hh-h, 6+s 12+hcp q#hh-s, 6+c 10+hcp 3-s 3-h, 6+d 10+hcp 3-s 3-h, s#5422 4+d 4+c 10+hcp"
        priority: 1
      2d:
        desc: "Both M inv+ or Signoff H or inv+ 5H or 1 suited slam try good suit"
        rule: "5+h 7-hcp, 5h s#5332 8-12hcp, 5h 3-s s#5422|5431 15+hcp, 5h 3-s s#5422|5431 9-14hcp q#hhh+h, 6h 12+hcp q#hhh+h, 4+h 4+s 8+hcp [$M=h, $OM=s]"
        priority: 1
      2h:
        desc: "Signoff S or inv+ 5s or 1 suited slam try good suit"
        rule: "5+s 7-hcp, 5s s#5332 8-12hcp, 5s 3-h s#5422|5431 15+hcp, 5s 3-h s#5422|5431 9-14hcp q#hhh+s, 6s 12+hcp q#hhh+s [$M=s, $OM=h]"
        priority: 1
      2s:
        desc: "Inv bal or signoff clubs or bal slam try or fg 54/45 minors"
        rule: "8-9hcp 3-h 3-s, 6+c 7-hcp, $14to15Bal, $16PlusBal"
        priority: 1

  fRKCBResponses:
    bids:
      "[1]":
        desc: "3 or 0"
        priority: 2
      "[2]":
        desc: "4 or 1"
        priority: 2
      "[3]":
        desc: "2"
        priority: 2
      "[4]":
        desc: "2 + q# of trumps"
        priority: 2
