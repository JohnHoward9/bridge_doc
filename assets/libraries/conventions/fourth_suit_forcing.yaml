library: "Fourth Suit Forcing (FSF / FSGF)"
description: "Gavin Wolpert Fourth Suit Game Force over two-suited auctions: strict priority order of opener rebids (3-card major support, NT with stopper, rebid of own suit) and full game/slam continuations"
version: "1.0"

imports:
  - "assets/libraries/conventions/rkcb_1430.yaml"

fragments:
  # =========================================================================
  # 1. 1C - 1H - 2D (Opener reverse) -> 2S is Fourth Suit Forcing
  # =========================================================================
  fFSF_Over_1C_1H_2D:
    desc: "Fourth Suit Forcing 2S over 1C - 1H - 2D (artificial GF, asks opener to describe hand)"
    forceTo: game
    bids:
      3h:
        desc: "Opener shows 3-card Heart support for responder's major (Priority 1)"
        rule: "16+hcp 3h"
        priority: 1
        bids:
          4h:
            desc: "Signoff in 4H"
            rule: "9-11hcp"
            priority: 10
          4nt:
            desc: "Roman Key Card Blackwood 1430 for Hearts"
            rule: "12+hcp"
            priority: 1
            ref: "fRKCBResponses"
            variables:
              trump: "h"
      2nt:
        desc: "Opener has Spade stopper, minimum reverse (Priority 2, 16-17 HCP)"
        rule: "16-17hcp as | 16-17hcp ks | 16-17hcp qs"
        priority: 2
        bids:
          3nt:
            desc: "3NT to play"
            rule: "9+hcp"
            priority: 1
          4h:
            desc: "Signoff in 4H with 6+ Hearts"
            rule: "9+hcp 6+h"
            priority: 2
      3nt:
        desc: "Opener has Spade stopper, maximum reverse (Priority 2, 18+ HCP)"
        rule: "18+hcp as | 18+hcp ks | 18+hcp qs"
        priority: 2
      3c:
        desc: "Opener rebids 6+ Clubs, no 3-card Heart support and no Spade stopper (Priority 3)"
        rule: "16+hcp 6+c"
        priority: 3
        bids:
          3nt:
            desc: "Responder bids 3NT with Spade stopper"
            rule: "9+hcp as | 9+hcp ks | 9+hcp qs"
            priority: 1
          4h:
            desc: "Signoff in 4H with 6+ Hearts"
            rule: "9+hcp 6+h"
            priority: 2
      3d:
        desc: "Opener rebids 5+ Diamonds, extra diamond length (Priority 3)"
        rule: "16+hcp 5+d"
        priority: 3
        bids:
          3nt:
            desc: "Responder bids 3NT with Spade stopper"
            rule: "9+hcp as | 9+hcp ks | 9+hcp qs"
            priority: 1

