      2d:
        desc: "Multi: one 6-card major (6+ Hearts or 6+ Spades, 8-15 HCP)"
        rule: "p#1 8-15hcp 6+h | p#1 8-15hcp 6+s"
        priority: 1
        bids:
          2h:
            desc: "Pass or correct to 2S"
