                desc: "Decline invitation with 6-7 HCP"
                rule: "p#10 6-7hcp"
                priority: 10
              4h:
                desc: "Accept invitation with 8-9 HCP"
                rule: "p#1 8-9hcp"
                priority: 1
          4h:
