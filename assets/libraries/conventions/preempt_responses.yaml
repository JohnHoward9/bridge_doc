library: "Preempt Responses & Namyats"
description: "Unified parameterized 3-level and 4-level preempts, solid minor 3NT, and 4NT"
version: "2.0"

imports:
  - "assets/libraries/conventions/namyats.yaml"

fragments:
  Preempt3Clubs:
    aliases: ["fPreempt3ClubResponses"]
    desc: "Preemptive opening in Clubs (7+ Clubs, 5-11 HCP)"
    rule: "5-11hcp 7+c 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt3"
    vars:
      suit: "c"
      suit_name: "Clubs"
      m: "c"
      m_name: "Clubs"

  Preempt3Diamonds:
    aliases: ["fPreempt3DiamondResponses"]
    desc: "Preemptive opening in Diamonds (7+ Diamonds, 5-11 HCP)"
    rule: "5-11hcp 7+d 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt3"
    vars:
      suit: "d"
      suit_name: "Diamonds"
      m: "d"
      m_name: "Diamonds"

  Preempt3Hearts:
    aliases: ["fPreempt3HeartResponses"]
    desc: "Preemptive opening in Hearts (7+ Hearts, 5-11 HCP)"
    rule: "5-11hcp 7+h 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt3"
    vars:
      suit: "h"
      suit_name: "Hearts"
      M: "h"
      M_name: "Hearts"

  Preempt3Spades:
    aliases: ["fPreempt3SpadeResponses"]
    desc: "Preemptive opening in Spades (7+ Spades, 5-11 HCP)"
    rule: "5-11hcp 7+s 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt3"
    vars:
      suit: "s"
      suit_name: "Spades"
      M: "s"
      M_name: "Spades"

  fPreempt3:
    desc: "Preemptive opening responses"
    bids:
      3d:
        cond: "$suit=c"
        desc: "Natural 5+ Diamonds (16+ HCP, GF)"
        rule: "16+hcp 5+d"
        priority: 1
      3h:
        cond: "$suit=c,d"
        desc: "Natural 5+ Hearts (16+ HCP, GF)"
        rule: "16+hcp 5+h"
        priority: 1
      3s:
        cond: "$suit=c,d,h"
        desc: "Natural 5+ Spades (16+ HCP, GF)"
        rule: "16+hcp 5+s"
        priority: 1
        bids:
          4s:
            desc: "Raise to 4S with 3+ Spades"
            rule: "3+s"
            priority: 1
          pass:
            desc: "Pass with 2- Spades"
            rule: "2-s"
            priority: 10
      3nt:
        desc: "To play (16-19 HCP balanced with outside stoppers)"
        rule: "16-19hcp balanced"
        priority: 2
      "4$suit":
        desc: "Raise in $suit_name (preemptive or to play)"
        rule: "3+$suit"
        priority: 3
      "5$m":
        desc: "Game in $m_name to play"
        rule: "12+hcp 3+$m"
        cond: "$m"
        priority: 2
      4nt:
        desc: "Roman Key Card Blackwood 1430 in $M_name"
        rule: "16+hcp 3+$M"
        cond: "$M"
        priority: 1

  SolidMinor3NT:
    aliases:
      - "Gambling3NT"
      - "fGambling3NTResponses"
    desc: "Solid minor opening (AKQxxxx or AKQJxxx minor, no outside A or K)"
    rule: "solid_minor outside_ctrl=0"
    priority: 2
    bids:
      pass:
        desc: "To play (responder has outside stoppers in all three suits)"
        rule: "10+hcp balanced"
        priority: 2
      4c:
        desc: "Pass or correct: asks opener to pass with Clubs or bid 4D with Diamonds"
        rule: "0-13hcp"
        priority: 1
        bids:
          pass:
            desc: "Opener passes holding solid Clubs"
            rule: "7+c"
            priority: 1
          4d:
            desc: "Opener corrects to Diamonds holding solid Diamonds"
            rule: "7+d"
            priority: 1
      4d:
        desc: "Shortness enquiry for slam investigation"
        rule: "14+hcp"
        priority: 1
        bids:
          4h:
            desc: "Opener has Heart shortness (singleton or void)"
            rule: "1-h"
            priority: 1
          4s:
            desc: "Opener has Spade shortness (singleton or void)"
            rule: "1-s"
            priority: 1
          4nt:
            desc: "Opener has no shortness (7-2-2-2 shape)"
            rule: "s#7222"
            priority: 2
      4h:
        desc: "Natural to play (long Hearts, independent of opener's minor)"
        rule: "6+h"
        priority: 2
      4s:
        desc: "Natural to play (long Spades, independent of opener's minor)"
        rule: "6+s"
        priority: 2
      5c:
        desc: "Pass or correct to 5-level minor game"
        rule: "13+hcp"
        priority: 1
        bids:
          pass:
            desc: "Opener passes holding Clubs"
            rule: "7+c"
          5d:
            desc: "Opener corrects to 5D holding Diamonds"
            rule: "7+d"

  Preempt4Hearts:
    aliases: ["fPreempt4HeartResponses"]
    desc: "Preemptive opening in Hearts (8+ Hearts, 6-10 HCP)"
    rule: "6-10hcp 8+h 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt4"
    vars:
      suit: "h"
      suit_name: "Hearts"
      M: "h"
      M_name: "Hearts"

  Preempt4Spades:
    aliases: ["fPreempt4SpadeResponses"]
    desc: "Preemptive opening in Spades (8+ Spades, 6-10 HCP)"
    rule: "6-10hcp 8+s 6+ltc controls<=2 outside_ctrl<=1"
    include: "fPreempt4"
    vars:
      suit: "s"
      suit_name: "Spades"
      M: "s"
      M_name: "Spades"

  fPreempt4:
    desc: "Preemptive opening to play responses"
    bids:
      4nt:
        desc: "Roman Key Card Blackwood 1430 in $suit_name"
        rule: "16+hcp"
        priority: 1
      "5$suit":
        desc: "Extension of preempt"
        rule: "3+$suit"
        priority: 2

  Preempt4NT:
    aliases:
      - "fPreempt4NTResponses"
    desc: "Specific Minors opening (6-6 or 7-6 minors, extreme freak, 6-11 HCP)"
    rule: "6-11hcp 6+c 6+d 4-ltc | 6-11hcp 7+c 6+d | 6-11hcp 6+c 7+d"
    priority: 1
    bids:
      5c:
        desc: "Pass or correct to opener's better minor"
        priority: 1
        bids:
          pass:
            desc: "Opener passes with longer Clubs"
            rule: "c>=d"
          5d:
            desc: "Opener corrects to Diamonds with longer Diamonds"
            rule: "d>c"
      5d:
        desc: "Signoff in Diamonds"
        rule: "4+d"
        priority: 2
      5h:
        desc: "Extreme Hearts to play"
        rule: "6+h"
        priority: 3
      5s:
        desc: "Extreme Spades to play"
        rule: "6+s"
        priority: 3
