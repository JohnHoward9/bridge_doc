            priority: 1
      "(2nt)":
        desc: "Opponent Unusual 2NT over 1S (showing minors 5-5)"
        ref: "fUnusualOverUnusual_Spades"
      "(2s)":
        desc: "Opponent Michaels Cuebid over 1S (showing Hearts + minor 5-5)"
        ref: "fMichaelsDefense_Major"

  Gavin1H1SOpening:
    desc: "Gavin 5+ $M_name opening (12+ HCP)"
    rule: "12+hcp 5+$M $M>=* [$M=$M, $OM=$OM]"
    bids:
      pass:
        desc: "Pass (0-5 HCP)"
        rule: "5-hcp"
        priority: 10

      # Natural 1S response only over 1H
      1s:
        desc: "Natural 4+ Spades forcing 1 round"
        rule: "5+hcp 4+s"
        cond: "$M=h"
        priority: 2
        include: "fSupportDoubles"
        bids:
          1nt:
            desc: "Balanced minimum without 4 Spades"
            rule: "12-14hcp 3-s"
            ref: "fThreeWayCheckback"
          2c:
            desc: "Natural secondary Clubs (3+ Clubs, 11-18 HCP)"
            rule: "3+c 11-18hcp"
            bids:
              pass:
                desc: "Pass with minimum and Club tolerance"
                rule: "0-6hcp"
                priority: 10
              2d:
                desc: "Fourth suit forcing (12+ HCP, Game Force)"
                rule: "12+hcp"
                priority: 1
                forceTo: game
                ref: "fFSF_Over_1H_1S_2C"
              2h:
                desc: "Preference to Hearts (6-10 HCP, 2+ Hearts)"
                rule: "6-10hcp 2+h"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3h:
                    desc: "Game invite with 6 Hearts (14-15 HCP)"
                    rule: "14-15hcp 6+h"
                    priority: 2
                  4h:
                    desc: "Game in Hearts (14-15 HCP)"
                    rule: "14-15hcp 6+h"
                    priority: 1
              2s:
                desc: "Rebid 5+ Spades (6-10 HCP)"
                rule: "6-10hcp 5+s"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3s:
                    desc: "Raise Spades with 3-card support (13-15 HCP)"
                    rule: "13-15hcp 3s"
                    priority: 2
                  4s:
                    desc: "Game in Spades with 3-card support (16-18 HCP)"
                    rule: "16+hcp 3s | 14-15hcp 3s"
                    priority: 1
              2nt:
                desc: "Natural balanced invitation (10-11 HCP)"
                rule: "10-11hcp"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3nt:
                    desc: "Accept invite to 3NT (14-15 HCP)"
                    rule: "14-15hcp"
                    priority: 1
              3c:
                desc: "Raise Clubs (6-10 HCP, 4+ Clubs)"
                rule: "6-10hcp 4+c"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum"
                    rule: "11-13hcp"
                    priority: 10
              3h:
                desc: "Invitational raise in Hearts (10-11 HCP, 3+ Hearts)"
                rule: "10-11hcp 3+h"
                priority: 2
                bids:
                  pass:
                    desc: "Decline game invitation"
                    rule: "11-13hcp"
                    priority: 10
                  4h:
                    desc: "Accept game in Hearts"
                    rule: "14-15hcp"
                    priority: 1
              3s:
                desc: "Invitational rebid in Spades (10-11 HCP, 6+ Spades)"
                rule: "10-11hcp 6+s"
                priority: 2
                bids:
                  pass:
                    desc: "Decline invitation"
                    rule: "11-13hcp"
                    priority: 10
                  4s:
                    desc: "Accept game in Spades"
                    rule: "14-15hcp"
                    priority: 1
              3nt:
                desc: "3NT to play without 3-card Heart support (12-15 HCP, balanced, 2- Hearts)"
                rule: "12-15hcp balanced 2-h 1+d n#a|k|qd"
                priority: 2
                forceTo: game
                bids:
                  pass:
                    desc: "Pass to play 3NT"
                    priority: 10
                  4h:
                    desc: "Pull 3NT to 4H with 6+ Hearts or unbalanced hand"
                    rule: "6+h | 5+h 1-d | 5+h 1-s"
                    priority: 1
              4h:
                desc: "Game in Hearts with 8-card fit (12-15 HCP, 3+ Hearts)"
                rule: "12-15hcp 3+h"
                priority: 1
                forceTo: game
              4s:
                desc: "Game in Spades (10+ HCP, 6+ Spades)"
                rule: "10+hcp 6+s"
                priority: 1
                forceTo: game

          2d:
            desc: "Natural secondary Diamonds (3+ Diamonds, 11-18 HCP)"
            rule: "3+d 11-18hcp"
            bids:
              pass:
                desc: "Pass with minimum and Diamond tolerance"
                rule: "0-6hcp"
                priority: 10
              2h:
                desc: "Preference to Hearts (6-10 HCP, 2+ Hearts)"
                rule: "6-10hcp 2+h"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3h:
                    desc: "Game invite with 6 Hearts (14-15 HCP)"
                    rule: "14-15hcp 6+h"
                    priority: 2
                  4h:
                    desc: "Game in Hearts (14-15 HCP)"
                    rule: "14-15hcp 6+h"
                    priority: 1
              2s:
                desc: "Rebid 5+ Spades (6-10 HCP)"
                rule: "6-10hcp 5+s"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3s:
                    desc: "Raise Spades with 3-card support (13-15 HCP)"
                    rule: "13-15hcp 3s"
                    priority: 2
                  4s:
                    desc: "Game in Spades with 3-card support (16-18 HCP)"
                    rule: "16+hcp 3s | 14-15hcp 3s"
                    priority: 1
              2nt:
                desc: "Natural balanced invitation (10-11 HCP)"
                rule: "10-11hcp"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum 11-13 HCP"
                    rule: "11-13hcp"
                    priority: 10
                  3nt:
                    desc: "Accept invite to 3NT (14-15 HCP)"
                    rule: "14-15hcp"
                    priority: 1
              3c:
                desc: "Fourth suit forcing (12+ HCP, Game Force)"
                rule: "12+hcp"
                priority: 1
                forceTo: game
                ref: "fFSF_Over_1H_1S_2D"
              3d:
                desc: "Raise Diamonds (6-10 HCP, 4+ Diamonds)"
                rule: "6-10hcp 4+d"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum"
                    rule: "11-13hcp"
                    priority: 10
              3h:
                desc: "Invitational raise in Hearts (10-11 HCP, 3+ Hearts)"
                rule: "10-11hcp 3+h"
                priority: 2
                bids:
                  pass:
                    desc: "Decline game invitation"
                    rule: "11-13hcp"
                    priority: 10
                  4h:
                    desc: "Accept game in Hearts"
                    rule: "14-15hcp"
                    priority: 1
              3s:
                desc: "Invitational rebid in Spades (10-11 HCP, 6+ Spades)"
                rule: "10-11hcp 6+s"
                priority: 2
                bids:
                  pass:
                    desc: "Decline invitation"
                    rule: "11-13hcp"
                    priority: 10
                  4s:
                    desc: "Accept game in Spades"
                    rule: "14-15hcp"
                    priority: 1
              3nt:
                desc: "3NT to play without 3-card Heart support (12-15 HCP, balanced, 2- Hearts)"
                rule: "12-15hcp balanced 2-h 1+c n#a|k|qc"
                priority: 2
                forceTo: game
                bids:
                  4s:
                    desc: "Kickback RKCB 1430 for Hearts"
                    agreedSuit: "h"
                    rule: "16+hcp !balanced"
                    priority: 1
                    ref: "fKickbackHearts"
                  4h:
                    desc: "Rebid 5+ Hearts"
                    rule: "5+h 16+hcp"
                    priority: 2
                  pass:
                    desc: "Pass to play 3NT"
                    priority: 10
              4h:
                desc: "Game in Hearts with 8-card fit (12-15 HCP, 3+ Hearts)"
                rule: "12-15hcp 3+h"
                priority: 1
                forceTo: game
              4s:
                desc: "Game in Spades (10+ HCP, 6+ Spades)"
                rule: "10+hcp 6+s"
                priority: 1
                forceTo: game

          2h:
            desc: "Rebid 6-card Hearts"
            rule: "6+h 12-15hcp"
          2s:
            desc: "Raise Spades with 4-card support (12-15 HCP)"
            rule: "4+s 12-15hcp"
            bids:
              pass:
                desc: "Pass with minimum 6-9 HCP"
                rule: "6-9hcp"
                priority: 10
              3s:
                desc: "Invitational with 10-11 HCP"
                rule: "10-11hcp"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with 12-13 HCP"
                    rule: "12-13hcp"
                  4s:
                    desc: "Accept game with 14-15 HCP"
                    rule: "14-15hcp"
                    priority: 1
              4s:
                desc: "Game with 12+ HCP"
                rule: "12+hcp"
                priority: 1
          2nt:
            desc: "Opener 18-19 balanced"
            rule: "18-19hcp balanced"
            priority: 1
            ref: "fTransfersOver2NT"
          3c:
            desc: "Jump shift in Clubs (19+ HCP, 4+ Clubs, Game Force)"
            rule: "19+hcp 4+c !balanced"
            priority: 1
            forceTo: game
            bids:
              3s:
                desc: "Rebid 5+ Spades"
                rule: "5+s"
                priority: 2
                agreedSuit: "s"
                bids:
                  4s:
                    desc: "Fit Spades and set game"
                    rule: "3+s"
                    priority: 2
                    agreedSuit: "s"
                  4nt:
                    desc: "RKCB 1430 for Spades"
                    agreedSuit: "s"
                    rule: "18+hcp"
                    priority: 1
                    ref: "fRKCBResponses"
              3nt:
                desc: "Balanced game signoff"
                rule: "balanced 8-10hcp"
                priority: 3
              4c:
                desc: "Fit Clubs"
                rule: "4+c"
                priority: 2
                agreedSuit: "c"
          3d:
            desc: "Jump shift in Diamonds (19+ HCP, 4+ Diamonds, Game Force)"
            rule: "19+hcp 4+d !balanced"
            priority: 1
            forceTo: game
            bids:
              3h:
                desc: "Preference / support for Hearts (3+ Hearts)"
                rule: "3+h"
                priority: 1
                agreedSuit: "h"
                bids:
                  4h:
                    desc: "Game in Hearts"
                    rule: "15+hcp"
                    priority: 1
                  4nt:
                    desc: "RKCB 1430 for Hearts"
                    rule: "18+hcp"
                    priority: 1
                    ref: "fRKCBResponses"
              3s:
                desc: "Rebid 5+ Spades"
                rule: "5+s"
                priority: 2
                agreedSuit: "s"
                bids:
                  4h:
                    desc: "Game in Hearts with 6-card Hearts or spade shortness"
                    rule: "6+h | 5+h 2-s"
                    priority: 1
                    agreedSuit: "h"
                  4s:
                    desc: "Game in Spades with 3+ Spades"
                    rule: "3+s"
                    priority: 1
                  3nt:
                    desc: "Choice of game 3NT"
                    rule: "balanced | 2-s"
                    priority: 2
                  4d:
                    desc: "Fit Diamonds"
                    rule: "5+d 2-s"
                    priority: 2
                    agreedSuit: "d"
              3nt:
                desc: "Balanced game signoff"
                rule: "balanced"
                priority: 3
              4d:
                desc: "Fit Diamonds"
                rule: "4+d"
                priority: 2
                agreedSuit: "d"
          3s:
            desc: "Jump raise Spades with 4-card support (16-18 HCP)"
            rule: "4+s 16-18hcp"
            priority: 1
            bids:
              pass:
                desc: "Pass with minimum 6-7 HCP"
                rule: "6-7hcp"
                priority: 10
              4s:
                desc: "Game in Spades with 8+ HCP"
                rule: "8+hcp"
                priority: 1
          3h:
            desc: "Invitational 6+ Hearts"
            rule: "6+h 16-17hcp"
            bids:
              pass:
                desc: "Decline with 6-7 HCP"
                rule: "6-7hcp"
                priority: 10
              3s:
                desc: "Rebid 6+ Spades (8+ HCP, forcing)"
                rule: "6+s 8+hcp"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with minimum and no Spade fit"
                    rule: "1-s 16-17hcp"
                    priority: 10
                  3nt:
                    desc: "Choice of games"
                    rule: "16-17hcp"
                    priority: 2
                  4s:
                    desc: "Raise Spades with 2+ support"
                    rule: "2+s 16-17hcp"
                    priority: 1
              4c:
                desc: "Second suit / slam try (4+ Clubs, 10+ HCP, forcing)"
                rule: "4+c 10+hcp"
                priority: 1
                bids:
                  4d:
                    desc: "Kickback RKCB 1430 for Clubs"
                    agreedSuit: "c"
                    rule: "4+c 16+hcp"
                    priority: 1
                    ref: "fKickbackClubs"
                  5c:
                    desc: "Signoff in Clubs"
                    rule: "4+c 16-17hcp"
                    priority: 2
                  6c:
                    desc: "Direct slam in Clubs"
                    rule: "4+c 17+hcp"
                    priority: 1
              4h:
                desc: "Accept with 8+ HCP and 2+ Hearts"
                rule: "8+hcp 2+h"
                priority: 1
          4h:
            desc: "Opener to play in game (19-21 HCP, 6+ Hearts)"
            rule: "6+h 19+hcp"

      # Semi-forcing 1NT (6-11 HCP, denies 3 $M_name unless invitational 3-card limit raise)
      1nt:
        desc: "Semi-forcing 1NT (6-11 HCP, denies 3 $M_name or 10-11 HCP 3-card limit raise)"
        rule: "6-11hcp 2-$M | 10-11hcp 3$M"
        priority: 3
        bids:
          pass:
            desc: "Opener passes with 12-14 balanced"
