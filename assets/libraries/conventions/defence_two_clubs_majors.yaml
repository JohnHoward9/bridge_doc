library: "Defense Against 2C Both Majors (8-13 HCP)"
description: "Defense against opponent artificial 2C opening showing both majors (8-13 HCP, Tartan/Roman style)."
version: "1.0"

fragments:
  fTwoClubMajorsDefense:
    desc: "Opposition 2C Opening (Both Majors, 8-13 HCP)"
    rule: "8-13hcp 4+h 4+s"
    priority: 1
    bids:
      pass:
        desc: "Pass"
        rule: "p#10 0-11hcp"
        priority: 10

      # Double: 13-15 balanced or 16+ values
      dbl:
        desc: "Values / Takeout Double (13-15 HCP balanced or 16+ HCP any shape)"
        rule: "p#2 13-15hcp $bal | p#2 16+hcp"
        priority: 2
        bids:
          pass:
            desc: "Penalty pass against 2C doubled"
            rule: "p#1 4+c 8+hcp"
            priority: 1
          2d:
            desc: "Natural Diamonds (0-8 HCP, 4+ Diamonds)"
            rule: "0-8hcp 4+d"
          2nt:
            desc: "Inquiry / Lebensohl (10+ HCP)"
            rule: "10+hcp"
          3c:
            desc: "Cuebid: Game force (12+ HCP)"
            rule: "12+hcp"
          3d:
            desc: "Constructive Diamonds (9-11 HCP, 5+ Diamonds)"
            rule: "9-11hcp 5+d"

      # Natural 2D overcall
      2d:
        desc: "Natural Diamond overcall (11-16 HCP, 5+ Diamonds)"
        rule: "p#3 11-16hcp 5+d"
        priority: 3
        bids:
          pass:
            desc: "Pass"
            rule: "0-8hcp"
          3d:
            desc: "Constructive Diamond raise (8-10 HCP, 3+ Diamonds)"
            rule: "8-10hcp 3+d"
          3nt:
            desc: "Game in 3NT"
            rule: "12-14hcp"

      # 2NT Overcall: 16-18 HCP balanced with stoppers in both majors
      2nt:
        desc: "2NT Overcall: 16-18 HCP balanced with stoppers in both majors"
        rule: "p#1 16-18hcp $bal 3+h 3+s"
        priority: 1
        ref: "fGavin1NTResponses"

      # Natural 3-level minor overcalls
      3d:
        desc: "Jump overcall in Diamonds: 6+ Diamonds (11-15 HCP)"
        rule: "p#3 11-15hcp 6+d"
        priority: 3

      3nt:
        desc: "3NT to play with major stoppers and solid minor"
        rule: "p#1 16-18hcp"
        priority: 1
