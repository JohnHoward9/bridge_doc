library: "Namyats"
description: "Namyats 4C (Hearts) and 4D (Spades) showing 8.5 tricks with solid 7-8 card major"
version: "2.0"

fragments:
  fNamyats:
    desc: "Namyats (8.5 tricks with solid 7-8 $M_name, 10-15 HCP)"
    rule: "10-15hcp 7+$M controls>=3 5-ltc"
    priority: 1
    bids:
      "step#1":
        desc: "Control enquiry: asks opener for outside Ace/King"
        rule: "12+hcp"
        priority: 1
        bids:
          "4$M":
            desc: "Opener has sub-minimum without outside Ace/King"
            rule: "10-12hcp"
          "4$OM":
            cond: "$M=h"
            desc: "Opener has Spade Ace or King"
            rule: "1+s +as, 1+s +ks"
          4nt:
            desc: "Opener has outside Ace or King"
            rule: "1+$OM +a$OM, 1+$OM +k$OM, 1+d +ad, 1+d +kd"
          5c:
            cond: "$M=s"
            desc: "Opener has Club Ace or King"
            rule: "1+c +ac, 1+c +kc"
      "4$M":
        desc: "Relay signoff to play 4$M (opener declares)"
        priority: 2
      4nt:
        desc: "Roman Key Card Blackwood 1430 in $M_name"
        rule: "14+hcp"
        priority: 1
        ref: "fRKCB1430"

  Namyats4Clubs:
    aliases: ["fNamyatsClubResponses", "fNamyats4Clubs"]
    vars:
      M: "h"
    ref: "fNamyats"

  Namyats4Diamonds:
    aliases: ["fNamyatsDiamondResponses", "fNamyats4Diamonds"]
    vars:
      M: "s"
    ref: "fNamyats"
