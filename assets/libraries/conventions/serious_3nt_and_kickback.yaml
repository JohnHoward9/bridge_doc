library: "Serious 3NT, Kickback, & 1430 RKCB"
description: "Gavin Wolpert slam methods: Serious 3NT over major fit, Kickback (One Over Keycard) for minors and hearts, and 1430 RKCB"
version: "2.0"

imports:
  - "assets/libraries/conventions/rkcb_1430.yaml"
  - "assets/libraries/conventions/exclusion_rkcb.yaml"

fragments:
  fCuebidsOver3NT:
    desc: "1st and 2nd round cuebids, Last Train, and RKCB over Serious 3NT"
    bids:
      - 4c:
          desc: "Cuebid showing 1st or 2nd round Club control (Ace, King, singleton, or void)"
          rule: "ac | 0c | kc | 1c"
          priority: 1
          bids:
            "(x)":
              desc: "Lead-directing double of Club cuebid"
              bids:
                pass:
                  desc: "Pass denies 1st round control in Clubs"
                  rule: "!ac !0c"
                  priority: 2
                rdbl:
                  desc: "Redouble shows 1st round control in Clubs (Ace or Void)"
                  rule: "ac | 0c"
                  priority: 1
            4d:
              desc: "Cuebid showing 1st or 2nd round Diamond control"
              rule: "ad | 0d | kd | 1d"
              priority: 2
            4h:
              cond: "$M=s"
              desc: "Last Train to 4S: Slam cooperation below game without committing to 5-level"
              rule: "14+hcp"
              priority: 3
              bids:
                4s:
                  desc: "Signoff in 4S (minimum, cannot help with unbid controls)"
                  rule: "11-13hcp"
                  priority: 10
                4nt:
                  desc: "RKCB 1430 for Spades"
                  rule: "14+hcp"
                  priority: 1
                  ref: "fRKCBResponses"
            4s:
              cond: "$M=h"
              desc: "Kickback RKCB 1430 for Hearts"
              rule: "14+hcp"
              priority: 1
              ref: "fKickbackHearts"
            4nt:
              cond: "$M=s"
              desc: "RKCB 1430 for Spades"
              rule: "14+hcp"
              priority: 1
              ref: "fRKCBResponses"

      - 4d:
          desc: "Cuebid showing 1st or 2nd round Diamond control (Ace, King, singleton, or void)"
          rule: "ad | 0d | kd | 1d"
          priority: 2
          bids:
            "(x)":
              desc: "Lead-directing double of Diamond cuebid"
              bids:
                pass:
                  desc: "Pass denies 1st round control in Diamonds"
                  rule: "!ad !0d"
                  priority: 2
                rdbl:
                  desc: "Redouble shows 1st round control in Diamonds (Ace or Void)"
                  rule: "ad | 0d"
                  priority: 1
            4h:
              cond: "$M=s"
              desc: "Last Train to 4S: Slam cooperation below game without committing to 5-level"
              rule: "14+hcp"
              priority: 3
              bids:
                4s:
                  desc: "Signoff in 4S"
                  rule: "11-13hcp"
                  priority: 10
                4nt:
                  desc: "RKCB 1430 for Spades"
                  rule: "14+hcp"
                  priority: 1
                  ref: "fRKCBResponses"
            4s:
              cond: "$M=h"
              desc: "Kickback RKCB 1430 for Hearts"
              rule: "14+hcp"
              priority: 1
              ref: "fKickbackHearts"
            4nt:
              cond: "$M=s"
              desc: "RKCB 1430 for Spades"
              rule: "14+hcp"
              priority: 1
              ref: "fRKCBResponses"

      - 4h:
          cond: "$M=s"
          desc: "Heart control cuebid / Last Train to 4S"
          rule: "ah | 0h | kh | 1h | 13+hcp"
          priority: 3
          bids:
            4s:
              desc: "Signoff in 4S"
              rule: "11-13hcp"
              priority: 10
            4nt:
              desc: "RKCB 1430 for Spades"
              rule: "14+hcp"
              priority: 1
              ref: "fRKCBResponses"

      - 4h:
          cond: "$M=h"
          desc: "Signoff in agreed Hearts (no slam interest)"
          rule: "11-13hcp"
          priority: 10

      - 4s:
          cond: "$M=s"
          desc: "Signoff in agreed Spades (no slam interest)"
          rule: "11-13hcp"
          priority: 10

      - 4s:
          cond: "$M=h"
          desc: "Kickback RKCB 1430 for Hearts"
          rule: "14+hcp"
          priority: 1
          ref: "fKickbackHearts"

  fSerious3NT:
    desc: "Serious 3NT over agreed major suit game-forcing auction"
    bids:
      3nt:
        desc: "Serious 3NT: Strong slam interest, demands first-round cuebidding"
        rule: "15+hcp"
        priority: 1
        ref: "fCuebidsOver3NT"

  fKickbackAsk:
    desc: "Kickback RKCB Ask (One Over Keycard) based on agreed trump"
    bids:
      4s:
        cond: "$M=h"
        ref: "fKickbackHearts"
      4nt:
        cond: "$M=s"
        ref: "fRKCBResponses"
      4h:
        cond: "$trump=d"
        ref: "fKickbackDiamonds"
      4d:
        cond: "$trump=c"
        ref: "fKickbackClubs"

  fKickbackHearts:
    desc: "Kickback: 1430 RKCB for Hearts"
    rule: "14+hcp"
    priority: 1
    bids:
      4nt:
        desc: "Step 1: 1 or 4 Keycards"
        rule: "kc=1|4 h"
        priority: 1
        bids:
          6h:
            desc: "Small slam in Hearts"
            rule: "kc>=3 h | 10+hcp"
            priority: 1
          5h:
            desc: "Signoff in Hearts (missing 2 keycards)"
            rule: "kc<=2 h"
            priority: 2
          5s:
            desc: "Queen ask"
            rule: "kc>=3 h"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=3 h"
            priority: 2
            ref: "fSpecificKingResponses"
          7h:
            desc: "Grand slam in Hearts"
            rule: "kc>=3 h qh"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 h"
            priority: 3

      5c:
        desc: "Step 2: 0 or 3 Keycards"
        rule: "kc=0|3 h"
        priority: 1
        bids:
          5h:
            desc: "Signoff in Hearts (missing 2 keycards)"
            rule: "kc=0 h"
            priority: 2
          5s:
            desc: "Queen ask"
            rule: "kc>=2 h"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=2 h"
            priority: 2
            ref: "fSpecificKingResponses"
          6h:
            desc: "Small slam in Hearts (4 or 5 keycards combined)"
            rule: "kc>=1 h"
            priority: 1
          7h:
            desc: "Grand slam in Hearts"
            rule: "kc>=2 h qh"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 h"
            priority: 3

      5d:
        desc: "Step 3: 2 Keycards without Queen of Hearts"
        rule: "kc=2-q h"
        priority: 1
        bids:
          5h:
            desc: "Signoff in Hearts"
            rule: "kc<=1 h"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=3 h"
            priority: 2
            ref: "fSpecificKingResponses"
          6h:
            desc: "Small slam in Hearts"
            rule: "kc>=2 h"
            priority: 1
          7h:
            desc: "Grand slam in Hearts"
            rule: "kc>=3 h qh"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 h"
            priority: 3

      5h:
        desc: "Step 4: 2 Keycards with Queen of Hearts"
        rule: "kc=2+q h"
        priority: 1
        bids:
          pass:
            desc: "Signoff in 5 Hearts"
            rule: "kc<=1 h"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=3 h"
            priority: 2
            ref: "fSpecificKingResponses"
          6h:
            desc: "Small slam in Hearts"
            rule: "kc>=2 h"
            priority: 1
          7h:
            desc: "Grand slam in Hearts"
            rule: "kc>=3 h"
            priority: 1

  fKickbackDiamonds:
