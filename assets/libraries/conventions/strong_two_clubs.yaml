library: "Strong Two Clubs"
description: "Strong artificial 2C opening structure (GF or 22+ balanced) with 2D waiting (Kokish Relay) and positive natural responses"
version: "1.0"

imports:
  - "assets/libraries/conventions/kokish_relay.yaml"
  - "assets/libraries/conventions/rkcb_1430.yaml"

fragments:
