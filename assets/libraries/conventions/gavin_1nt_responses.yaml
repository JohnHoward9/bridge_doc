library: "Gavin Wolpert 1NT Responses"
description: "4-Way Transfers, Range Ask/Clubs (2S), Diamond Transfer (2NT), Puppet Stayman (3C), 5-5 Minors (3D), and Major Shortness (3H/3S)"
version: "2.0"

imports:
  - "assets/libraries/conventions/smolen.yaml"
  - "assets/libraries/conventions/stayman.yaml"
  - "assets/libraries/conventions/jacoby_transfers.yaml"
  - "assets/libraries/conventions/gerber.yaml"
  - "assets/libraries/conventions/puppet_stayman_1nt.yaml"
  - "assets/libraries/conventions/transfer_lebensohl.yaml"

definitions:
  bal: "s#5332|4432|4333"
  strongnt: "15-17hcp s#5332|4432|4333 | 15-17hcp s#6322 4-h 4-s | 15-16hcp dist#2452|2425 | 15-17hcp dist#2245|2254"

fragments:
  Gavin1NTOpening:
    aliases: ["fGavin1NTResponses"]
    desc: "Strong balanced NT (15-17 HCP)"
    rule: "$strongnt"
    priority: 1
    include:
      - "f1NTInterferenceDefense"
      - "fTexasTransfers"
      - "fGerber"
    bids:
      pass:
        desc: "Pass to play (0-7 HCP balanced)"
        rule: "7-hcp 4-h 4-s"
        priority: 10

      2c:
        desc: "Regular Stayman: both 4-card majors (GF), invitational with 4-card major, 5-4 majors GF for Smolen, 4M-5m GF, or weak Garbage Stayman"
        rule: "10+hcp 5h 4s | 10+hcp 4h 5s | 10+hcp 4+h 4+s | 10+hcp 4+h 5+c | 10+hcp 4+h 5+d | 10+hcp 4+s 5+c | 10+hcp 4+s 5+d | 8-9hcp 4=h 3-s !s#4333 | 8-9hcp 4=s 3-h !s#4333 | 8-9hcp 4+h 4+s | 0-7hcp 4+h 4+s | 0-7hcp 5+h 4+s | 0-7hcp 4+h 5+s"
        priority: 1
        ref: "fStayman"

      2d:
        desc: "Jacoby Transfer to Hearts (5+ Hearts)"
        rule: "5+h 3-s [$M=h] | 0-9hcp 5+h [$M=h] | 5+h [$M=h]"
        priority: 1
        vars:
          M: "h"
        ref: "fJacobyTransferSuperAcceptAndAccept"

      2h:
        desc: "Jacoby Transfer to Spades (5+ Spades)"
        rule: "5+s 3-h [$M=s] | 0-9hcp 5+s [$M=s] | 10+hcp 5+s 5+h [$M=s] | 5+s [$M=s]"
        priority: 1
        vars:
          M: "s"
        ref: "fJacobyTransferSuperAcceptAndAccept"

      2s:
        desc: "Range Ask or Clubs: forces 2NT (minimum) or 3C (maximum), or 4333 invitation"
        rule: "8-9hcp 3-h 3-s | 8-9hcp s#4333 | 6+c"
        priority: 2
        bids:
          2nt:
            desc: "Opener minimum (14.5-15 HCP)"
            rule: "14-15hcp"
            priority: 2
            bids:
              pass:
                desc: "Pass with balanced invitational hand (declined)"
                rule: "8-9hcp"
              3c:
                desc: "Signoff in 6+ Clubs"
                rule: "6+c 0-7hcp"
              3d:
                desc: "Diamond shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-d"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Spades and Hearts)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Diamond values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Diamonds"
                    rule: "3+c"
              3h:
                desc: "Heart shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-h"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Spades and Diamonds)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Heart values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Hearts"
                    rule: "3+c"
              3s:
                desc: "Spade shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-s"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Hearts and Diamonds)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Spade values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Spades"
                    rule: "3+c"
              3nt:
                desc: "Raise to 3NT with long running clubs"
                rule: "6+c 10+hcp 2+d 2+h 2+s"
                priority: 2
          3c:
            desc: "Opener maximum (16-17 HCP)"
            rule: "16-17hcp"
            priority: 1
            bids:
              pass:
                desc: "Signoff in Clubs with weak hand"
                rule: "6+c 0-7hcp"
              3d:
                desc: "Diamond shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-d"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Spades and Hearts)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Diamond values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Diamonds"
                    rule: "3+c"
              3h:
                desc: "Heart shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-h"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Spades and Diamonds)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Heart values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Hearts"
                    rule: "3+c"
              3s:
                desc: "Spade shortness (singleton/void), 6+ Clubs, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+c 1-s"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Hearts and Diamonds)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Club support with Spade values"
                    rule: "3+c"
                  5c:
                    desc: "Signoff in 5C with unstopped Spades"
                    rule: "3+c"
              3nt:
                desc: "Accept game with invitational values"
                rule: "8+hcp"

      2nt:
        desc: "Transfer to Diamonds (forces 3D): signoff, choice of games, or GF with minor shortness"
        rule: "6+d"
        priority: 2
        bids:
          3d:
            desc: "Opener accepts transfer to Diamonds"
            rule: "15-17hcp"
            bids:
              pass:
                desc: "Signoff in 3D (0-7 HCP, 6+ Diamonds)"
                rule: "0-7hcp"
              3h:
                desc: "Heart shortness (singleton/void), 6+ Diamonds, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+d 1-h"
                priority: 1
                bids:
                  3s:
                    desc: "Cuebid showing Spade control with Diamond support"
                    rule: "3+d"
                  3nt:
                    desc: "To play (stoppers in unbid suits: Spades and Clubs)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Cuebid showing Club control with Diamond support"
                    rule: "3+d"
                  4d:
                    desc: "Diamond support, minimum or unsuitable for 3NT"
                    rule: "3+d"
                  5d:
                    desc: "Signoff in 5D with Diamond support and unstopped Hearts"
                    rule: "3+d"
              3s:
                desc: "Spade shortness (singleton/void), 6+ Diamonds, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+d 1-s"
                priority: 1
                bids:
                  3nt:
                    desc: "To play (stoppers in unbid suits: Hearts and Clubs)"
                    rule: "15-17hcp"
                  4c:
                    desc: "Cuebid showing Club control with Diamond support"
                    rule: "3+d"
                  4d:
                    desc: "Diamond support, minimum or unsuitable for 3NT"
                    rule: "3+d"
                  4h:
                    desc: "Cuebid showing Heart control with Diamond support"
                    rule: "3+d"
                  5d:
                    desc: "Signoff in 5D with Diamond support and unstopped Spades"
                    rule: "3+d"
              3nt:
                desc: "Choice of games with long diamonds (10+ HCP, balanced/no shortness)"
                rule: "10+hcp 2+h 2+s 2+c"
                priority: 2
                bids:
                  pass:
                    desc: "Opener accepts 3NT with outside stoppers"
                    rule: "15-17hcp"
                  4d:
                    desc: "Opener pulls to 4D with Diamond fit and unstopped side suit"
                    rule: "3+d"
                  5d:
                    desc: "Opener bids 5D game with 4+ Diamonds and weak stoppers"
                    rule: "4+d"
              4c:
                desc: "Club shortness (singleton/void), 6+ Diamonds, Game Forcing (10+ HCP)"
                rule: "10+hcp 6+d 1-c"
                priority: 1
                bids:
                  4d:
                    desc: "Diamond support, minimum or unsuitable for 3NT"
                    rule: "3+d"
                  4h:
                    desc: "Cuebid showing Heart control with Diamond support"
                    rule: "3+d"
                  4s:
                    desc: "Cuebid showing Spade control with Diamond support"
                    rule: "3+d"
                  5d:
                    desc: "Signoff in 5D with Diamond support and unstopped Clubs"
                    rule: "3+d"

      3c:
        desc: "Puppet Stayman: GF with exactly one 4-card major or 3-card major (denies 5-card major)"
        rule: "10+hcp 4-h 4-s 3+h 4-c 4-d !s#4333 | 10+hcp 4-h 4-s 3+s 4-c 4-d !s#4333"
        ref: "fPuppetStayman1NT"
        priority: 1

      3d:
        desc: "5-5 Minors Game Forcing (10+ HCP, slam try or 3NT choice)"
        rule: "10+hcp 5+c 5+d"
        priority: 1
        bids:
          3nt:
            desc: "Opener prefers 3NT"
            rule: "15-17hcp"
          4c:
            desc: "Opener fits Clubs"
            rule: "3+c"
          4d:
            desc: "Opener fits Diamonds"
            rule: "3+d"

      "[3h-3s]":
        desc: "Shows a singleton/void in $M_name, exactly 3 $OM_name, and 5-4 or 4-5 in the minors (Game Forcing)"
        rule: "10+hcp 1-$M 3=$OM 5+c 4+d | 10+hcp 1-$M 3=$OM 4+c 5+d"
        priority: 1
        bids:
          "4$OM":
            desc: "Opener bids 4 $OM_name with 5-card suit or good 4-card suit"
            rule: "5+$OM | 4=$OM good_suit:$OM"
            priority: 1
          3nt:
            desc: "Opener signs off in 3NT with $M_name stopper"
            rule: "15-17hcp"
            priority: 2
          4c:
            desc: "Opener agrees Clubs"
            rule: "4+c"
            priority: 3
          4d:
            desc: "Opener agrees Diamonds"
            rule: "4+d"
            priority: 3

      3nt:
        desc: "To play (10-15 HCP balanced without 4-card major, or 4333 shape with 4M)"
        rule: "10-15hcp 3-h 3-s | 10-15hcp s#4333"
        priority: 1

  fShortMajorMinorSlamContinuations:
    desc: "Opener continuations over minor-suit slam try with major shortness"
    bids:
      3nt:
        desc: "Opener signs off in 3NT with outside values"
        rule: "15-17hcp"
        priority: 1
      4c:
        desc: "Opener agrees Clubs"
        rule: "4+c"
        priority: 2
      4d:
        desc: "Opener agrees Diamonds"
        rule: "4+d"
        priority: 2
