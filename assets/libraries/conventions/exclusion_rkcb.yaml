      7h:
        desc: "Grand slam in Hearts"
        rule: "kc=3 h qh"
        priority: 2

  fExclusionCaptainStep3_Hearts:
    desc: "Captain follow-ups over Step 3 (Partner has 2 Keycards without Queen of Hearts)"
    bids:
      5h:
        desc: "Signoff in 5H"
        rule: "kc<=1 h"
        priority: 2
      6h:
        desc: "Small slam in 6H"
        rule: "kc=2 h"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try"
        rule: "kc=2 h qh"
        priority: 1
