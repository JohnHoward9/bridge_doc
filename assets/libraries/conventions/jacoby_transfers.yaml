library: "Jacoby Transfers"
description: "Jacoby Transfer responses over 1NT and continuation raises"
version: "1.0"

fragments:
  fJacobyTransferAcceptance:
    desc: "Responder follow-ups after opener accepts transfer"
    bids:
      pass:
        desc: "Signoff with weak hand (0-7 HCP)"
        rule: "0-7hcp"
        priority: 10
      2s:
        desc: "5-5 in the majors, invitational (8-9 HCP, 5+ Hearts, 5+ Spades)"
        rule: "8-9hcp 5+h 5+s"
        cond: "$M=h"
        priority: 1
        bids:
          pass:
            desc: "Opener declines with minimum and spade preference (3+ spades)"
            rule: "15-hcp 3+s"
            priority: 10
          2nt:
            desc: "Opener declines with minimum and doubleton in both majors"
            rule: "15-hcp 2-s 2-h"
            priority: 2
          3h:
            desc: "Opener declines with minimum and heart preference (3+ hearts)"
            rule: "15-hcp 3+h"
            priority: 1
          3s:
            desc: "Opener invites/accepts spades"
            rule: "16+hcp 3+s"
            priority: 1
          4h:
            desc: "Opener accepts game in Hearts with maximum and 3+ hearts"
            rule: "16+hcp 3+h"
            priority: 1
          4s:
            desc: "Opener accepts game in Spades with maximum and 3+ spades"
            rule: "16+hcp 3+s"
            priority: 1
      2nt:
        desc: "Invitational with 5-card major (8-9 HCP)"
        rule: "8-9hcp 5$M"
        priority: 2
        bids:
          pass:
            desc: "Opener declines in NT (only 2 in major, minimum)"
            rule: "15-hcp 2-$M"
            priority: 10
          3$M:
            desc: "Opener declines in 3$M with 3-card fit"
            rule: "15-hcp 3+$M"
            priority: 2
          3nt:
            desc: "Opener accepts in 3NT"
            rule: "16+hcp 2-$M"
            priority: 1
          4$M:
            desc: "Opener accepts in 4$M with 3-card fit"
            rule: "16+hcp 3+$M"
            priority: 1
      3h:
        desc: "Second major Hearts, 5-5 in majors, GF or highly constructive (8+ HCP, 5+ Spades, 5+ Hearts)"
        rule: "8+hcp 5+s 5+h"
        cond: "$M=s"
        priority: 1
        bids:
          3nt:
            desc: "No 3-card fit in either major (2-h 2-s)"
            rule: "2-h 2-s"
            priority: 2
            bids:
              pass:
                desc: "Pass to play 3NT"
                priority: 10
              4s:
                desc: "6-5 majors, preference to 4S"
                rule: "6+s"
                priority: 1
          4h:
            desc: "Opener chooses 4H with 3+ Heart fit"
            rule: "3+h"
            priority: 1
            bids:
              pass:
                desc: "To play"
                priority: 10
          4s:
            desc: "Opener chooses 4S with 3+ Spade fit"
            rule: "3+s"
            priority: 1
            bids:
              pass:
                desc: "To play"
                priority: 10
      3s:
        desc: "Second major Spades over Heart transfer, GF 5-5 majors (10+ HCP)"
        rule: "10+hcp 5+h 5+s"
        cond: "$M=h"
        priority: 1
        bids:
          3nt:
            desc: "No 3-card fit in either major (2-h 2-s)"
            rule: "2-h 2-s"
            priority: 2
            bids:
              pass:
                desc: "Pass to play 3NT"
                priority: 10
          4h:
            desc: "Opener chooses 4H with 3+ Heart fit"
            rule: "3+h"
            priority: 1
            bids:
              pass:
                desc: "To play"
                priority: 10
          4s:
            desc: "Opener chooses 4S with 3+ Spade fit"
            rule: "3+s"
            priority: 1
            bids:
              pass:
                desc: "To play"
                priority: 10
      3$M:
        desc: "Invitational with 6+ card major (8-9 HCP)"
        rule: "8-9hcp 6+$M"
        priority: 2
        bids:
          pass:
            desc: "Opener declines with minimum"
            rule: "15-hcp"
            priority: 10
          4$M:
            desc: "Opener accepts game with maximum"
            rule: "16+hcp"
            priority: 1
      3c:
        desc: "Natural second suit Clubs, Game Forcing (10+ HCP, 5+ major, 4+ clubs)"
        rule: "10+hcp 5+$M 5+c | 10+hcp 5+$M 4+c !s#5332 !s#5422 | 10+hcp 5+$M 4+c !short_honors"
        priority: 1
        bids:
          "4$M":
            desc: "Opener converts to 4$M with 3-card fit"
            rule: "3+$M"
            priority: 1
          3nt:
            desc: "Opener bids 3NT with outside suits stopped (2 or fewer trumps)"
            rule: "15-17hcp 2-$M"
            priority: 2
          4c:
            desc: "Opener raises clubs with 4+ card fit"
            rule: "4+c"
            priority: 2
          5c:
            desc: "Opener signs off in 5C"
            rule: "4+c"
            priority: 3
      3d:
        desc: "Natural second suit Diamonds, Game Forcing (10+ HCP, 5+ major, 4+ diamonds)"
        rule: "10+hcp 5+$M 5+d | 10+hcp 5+$M 4+d !s#5332 !s#5422 | 10+hcp 5+$M 4+d !short_honors"
        priority: 1
        bids:
          "4$M":
            desc: "Opener converts to 4$M with 3-card fit"
            rule: "3+$M"
            priority: 1
          3nt:
            desc: "Opener bids 3NT with outside suits stopped (2 or fewer trumps)"
            rule: "15-17hcp 2-$M"
            priority: 2
          4d:
            desc: "Opener raises diamonds with 4+ card fit"
            rule: "4+d"
            priority: 2
          5d:
            desc: "Opener signs off in 5D"
            rule: "4+d"
            priority: 3
      3nt:
        desc: "Choice of games with balanced 5-card major (10-15 HCP)"
        rule: "10-15hcp 5$M s#5332 | 10-15hcp 5$M s#5422 short_honors"
        priority: 2
        bids:
          pass:
            desc: "Opener passes with doubleton"
            rule: "2-$M"
            priority: 10
          4$M:
            desc: "Opener converts with 3-card fit"
            rule: "3+$M"
            priority: 1
      4$M:
        desc: "Game signoff with 6+ card major (10+ HCP)"
        rule: "10+hcp 6+$M"
        priority: 1
        bids:
          pass:
            desc: "To play"
            priority: 10

  fJacobyTransferSuperAcceptAndAccept:
    desc: "Opener super-accept or accept of Jacoby Transfer to $M_name"
    bids:
      "3$M":
        desc: "Opener super-accepts transfer to $M_name (4+ $M_name, maximum 16-17 HCP)"
        rule: "16-17hcp 4+$M"
        priority: 1
        bids:
          pass:
            desc: "Signoff with weak hand (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          "4$M":
            desc: "Game signoff in $M_name (8+ HCP)"
            rule: "8+hcp"
            priority: 1
            bids:
              pass:
                desc: "To play"
                priority: 10
      "2$M":
        desc: "Opener accepts transfer to $M_name"
        rule: "2+$M"
        priority: 2
        ref: "fJacobyTransferAcceptance"

  fTexasTransferAccept:
    desc: "Opener accepts Texas Transfer to $M_name"
    bids:
      "4$M":
        desc: "Opener accepts transfer to 4$M"
        rule: "2+$M"
        priority: 1
        bids:
          pass:
            desc: "To play"
            priority: 10

  fTexasTransfers:
    desc: "Texas Transfers over 1NT or 2NT (4D -> 4H, 4H -> 4S)"
    bids:
      "[4d-4h]":
        desc: "Texas Transfer to $M_name (6+ $M_name to play)"
        rule: "6+$M 10+hcp"
        priority: 1
        ref: "fTexasTransferAccept"

  fJacobyTransfers:
    desc: "Jacoby Transfers over 1NT (2D -> 2H, 2H -> 2S)"
    bids:
      "[2d-2h]":
        desc: "Jacoby Transfer to $M_name (5+ $M_name)"
        rule: "5+$M 3-$OM | 0-9hcp 5+$M | 10+hcp 5+$M 5+$OM | 5+$M"
        priority: 1
        ref: "fJacobyTransferSuperAcceptAndAccept"

