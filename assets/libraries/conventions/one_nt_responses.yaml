library: "1NT Responses"
description: "Stayman 2C, Jacoby Transfers, and natural continuations over 1NT"
version: "1.0"

imports:
  - "assets/libraries/conventions/smolen.yaml"
  - "assets/libraries/conventions/stayman.yaml"
  - "assets/libraries/conventions/jacoby_transfers.yaml"
  - "assets/libraries/conventions/transfer_lebensohl.yaml"

fragments:
  f1NTResponses:
    desc: "Responses to 1NT Opening (15-17 or 12-14)"
    include:
      - "f1NTInterferenceDefense"
      - "fJacobyTransfers"
      - "fTexasTransfers"
    bids:
      pass:
        desc: "To play (0-7 HCP without 5-card major)"
        rule: "7-hcp 4-h 4-s"
        priority: 10

      2c:
        desc: "Stayman: asks for 4-card major (or 5-4 majors GF for Smolen, 4M-5m GF, or weak Garbage Stayman)"
        rule: "10+hcp 5h 4s | 10+hcp 4h 5s | 10+hcp 4=h 4=s | 10+hcp 4+h 5+c | 10+hcp 4+h 5+d | 10+hcp 4+s 5+c | 10+hcp 4+s 5+d | 8-9hcp 4=h 3-s !s#4333 | 8-9hcp 4=s 3-h !s#4333 | 8-9hcp 4=h 4=s | 8-9hcp 4=h 5=s | 0-7hcp 4+h 4+s | 0-7hcp 5+h 4+s | 0-7hcp 4+h 5+s"
        priority: 1
        ref: "fStayman"

      2s:
        desc: "Minor suit enquiry or signoff in clubs"
        rule: "6+c"
        priority: 3

      2nt:
        desc: "Natural quantitative invitation"
        rule: "8-9hcp 3-h 3-s"
        priority: 3

      3c:
        desc: "Game forcing natural Clubs (6+ Clubs, slam interest)"
        rule: "10+hcp 6+c"
        priority: 2

      3d:
        desc: "Game forcing natural Diamonds (6+ Diamonds, slam interest)"
        rule: "10+hcp 6+d"
        priority: 2

      3nt:
        desc: "To play (10-15 HCP without 4-card major)"
        rule: "10-15hcp 3-h 3-s"
        priority: 3
