    ref: "Gavin1H1SOpening"
    bids:
      "(x)":
        desc: "Transfers after 1S - (X)"
        ref: "fTransfersAfter1S_Double"
      "(2c)":
        desc: "Opponent 2C overcall over 1S"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double: 4+ Hearts (8+ HCP)"
            rule: "8+hcp 4+h"
            priority: 1
          2d:
            desc: "Natural 5+ Diamonds (8+ HCP)"
            rule: "8+hcp 5+d"
            priority: 2
          2h:
            desc: "Natural 5+ Hearts (10+ HCP)"
            rule: "10+hcp 5+h"
            priority: 1
          2s:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3s"
            priority: 2
          2nt:
            desc: "Natural with Club stopper (10-12 HCP)"
            rule: "10-12hcp n#a|k|qc"
            priority: 2
          3c:
            desc: "Cuebid of opponent's Club suit: Limit raise or better in Spades (10+ HCP, 3+ Spades)"
            rule: "10+hcp 3+s"
            priority: 1
          3s:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+s"
            priority: 2
          4s:
            desc: "LoTT game raise (5+ Spades)"
            rule: "5+s"
            priority: 1
      "(2d)":
        desc: "Opponent 2D overcall over 1S"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double: 4+ Hearts (8+ HCP)"
            rule: "8+hcp 4+h"
            priority: 1
          2h:
            desc: "Natural 5+ Hearts (10+ HCP)"
            rule: "10+hcp 5+h"
            priority: 1
          2s:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3s"
            priority: 2
          2nt:
            desc: "Natural with Diamond stopper (10-12 HCP)"
            rule: "10-12hcp n#a|k|qd"
            priority: 2
          3d:
            desc: "Cuebid of opponent's Diamond suit: Limit raise or better in Spades (10+ HCP, 3+ Spades)"
            rule: "10+hcp 3+s"
            priority: 1
          3s:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+s"
            priority: 2
          4s:
            desc: "LoTT game raise (5+ Spades)"
            rule: "5+s"
            priority: 1
      "(2h)":
        desc: "Opponent 2H overcall over 1S"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double: 4+ in a minor or balanced (8+ HCP)"
            rule: "8+hcp 3-s"
            priority: 1
          2s:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3s"
            priority: 2
          2nt:
            desc: "Natural with Heart stopper (10-12 HCP)"
            rule: "10-12hcp n#a|k|qh"
            priority: 2
          3h:
            desc: "Cuebid of opponent's Heart suit: Limit raise or better in Spades (10+ HCP, 3+ Spades)"
            rule: "10+hcp 3+s"
            priority: 1
          3s:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+s"
            priority: 2
          4s:
            desc: "LoTT game raise (5+ Spades)"
