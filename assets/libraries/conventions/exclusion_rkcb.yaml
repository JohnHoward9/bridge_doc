library: "Exclusion RKCB"
description: "Gavin Wolpert Master Series: Exclusion Key Card Blackwood (0314 steps) showing a void"
version: "2.0"

imports:
  - "assets/libraries/conventions/rkcb_1430.yaml"

fragments:
  # --- Captain Continuations for Agreed Spades ---
  fExclusionCaptainStep1_Spades:
    desc: "Captain follow-ups over Step 1 (Partner has 0 or 3 Keycards outside void)"
    bids:
      5s:
        desc: "Signoff in 5S (Missing 2 Keycards: Partner has 0 KC, Captain has <=2 KC = <=2 total)"
        rule: "kc<=2 s"
        priority: 2
      6s:
        desc: "Small slam in 6S (Partner has 3 KC + Captain's 1 KC = all 4 Keycards)"
        rule: "kc=1 s"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try (Partner has 3 KC + Captain's 1 KC with Queen = all 4 KC + Queen)"
        rule: "kc=1 s qs"
        priority: 1
        ref: "fSpecificKingResponses"
      7s:
        desc: "Grand slam in Spades"
        rule: "kc=1 s qs"
        priority: 2

  fExclusionCaptainStep2_Spades:
    desc: "Captain follow-ups over Step 2 (Partner has 1 or 4 Keycards outside void)"
    bids:
      5s:
        desc: "Signoff in 5S (Missing 2 Keycards: Partner has 1 KC, Captain has <=2 KC = <=3 total)"
        rule: "kc<=2 s"
        priority: 2
      6s:
        desc: "Small slam in 6S (Partner has 1 KC + Captain's 3 KC = all 4 Keycards)"
        rule: "kc=3 s"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try (Partner has 1 KC + Captain's 3 KC with Queen = all 4 KC + Queen)"
        rule: "kc=3 s qs"
        priority: 1
        ref: "fSpecificKingResponses"
      7s:
        desc: "Grand slam in Spades"
        rule: "kc=3 s qs"
        priority: 2

  fExclusionCaptainStep3_Spades:
    desc: "Captain follow-ups over Step 3 (Partner has 2 Keycards without Queen of Spades)"
    bids:
      5s:
        desc: "Signoff in 5S (Missing 1 KC and Queen: Captain has 1 KC + Partner's 2 = 3 total)"
        rule: "kc<=1 s"
        priority: 2
      6s:
        desc: "Small slam in 6S (Captain has 2 KC without Queen = all 4 KC without Queen)"
        rule: "kc=2 s"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try (Captain has 2 KC with Queen = all 4 KC + Queen)"
        rule: "kc=2 s qs"
        priority: 1
        ref: "fSpecificKingResponses"
      7s:
        desc: "Grand slam in Spades"
        rule: "kc=2 s qs"
        priority: 2

  fExclusionCaptainStep4_Spades:
    desc: "Captain follow-ups over Step 4 (Partner has 2 Keycards with Queen of Spades)"
    bids:
      5s:
        desc: "Signoff in 5S (Captain has 1 KC + Partner's 2 = 3 total)"
        rule: "kc<=1 s"
        priority: 2
      6s:
        desc: "Small slam in 6S"
        rule: "kc>=2 s"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try (Captain has 2 KC + Partner's 2 with Queen = all 4 KC + Queen)"
        rule: "kc=2 s"
        priority: 1
        ref: "fSpecificKingResponses"
      7s:
        desc: "Grand slam in Spades"
        rule: "kc=2 s"
        priority: 2

  # --- Captain Continuations for Agreed Hearts ---
  fExclusionCaptainStep1_Hearts:
    desc: "Captain follow-ups over Step 1 (Partner has 0 or 3 Keycards outside void)"
    bids:
      5h:
        desc: "Signoff in 5H (Missing 2 Keycards: Partner has 0 KC, Captain has <=2 KC = <=2 total)"
        rule: "kc<=2 h"
        priority: 2
      6h:
        desc: "Small slam in 6H (Partner has 3 KC + Captain's 1 KC = all 4 Keycards)"
        rule: "kc=1 h"
        priority: 1
      5nt:
