library: "Major Interference Defense"
description: "Defensive bidding structures when opponents interfere over 1H or 1S opening: (X) Takeout Double, (1NT), (2C), (2D), (2NT) Unusual 2NT, and Michaels Cuebid"
version: "1.1"

imports:
  - "assets/libraries/conventions/suit_overcalls_and_michaels.yaml"

fragments:
  fMajorInterferenceDefense:
    desc: "Interference defense over 1$M opening"
    bids:
      "(1nt)":
        desc: "Interference 1NT overcall (15-18 HCP balanced)"
        bids:
          pass:
            desc: "Pass (0-9 HCP)"
            rule: "9-hcp"
            priority: 10
          dbl:
            desc: "Penalty Double (10+ HCP, balanced/values)"
            rule: "10+hcp"
            priority: 1
          "2$M":
            desc: "Competitive raise to 2$M (3+ $M_name, 6-9 HCP)"
            rule: "6-9hcp 3+$M"
            priority: 2
            ref: "fGavinCompetitiveRaiseContinuations"
          "3$M":
            desc: "Preemptive raise to 3$M (4+ $M_name, 5-9 HCP)"
            rule: "5-9hcp 4+$M"
            priority: 3

      "(2c)":
        desc: "Interference 2C overcall"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
            bids:
              pass:
                desc: "West passes"
                bids:
                  dbl:
                    desc: "Opener reopening takeout double (short Clubs, 12+ HCP)"
                    rule: "12+hcp 2-c"
                  "2$M":
                    desc: "Opener rebid 6+ $M_name or extra shape"
                    rule: "6+$M | 5+$M 4-ltc"
          dbl:
            desc: "Negative Double (specifically 4 $OM_name, 8+ HCP)"
            rule: "8+hcp 4=$OM"
            priority: 1
            bids:
              "2$OM":
                desc: "Opener accepts $OM_name with 4-card fit"
                rule: "4+$OM"
                priority: 1
              "2$M":
                desc: "Opener rebids 6-card $M_name"
                rule: "6+$M"
                priority: 2
              2nt:
                desc: "Opener stopper in Clubs (12-14 balanced)"
                rule: "1+c n#a|k|qc"
                priority: 2
              "3$OM":
                desc: "Opener invitational raise in $OM_name (15-17 HCP, 4+ $OM_name)"
                rule: "15-17hcp 4+$OM"
                priority: 1
              "4$OM":
                desc: "Opener game in $OM_name"
                rule: "18+hcp 4+$OM"
                priority: 1
          "2$M":
            desc: "Simple raise to 2$M (3+ $M_name, 6-9 HCP)"
            rule: "6-9hcp 3+$M"
            priority: 2
            ref: "fGavinCompetitiveRaiseContinuations"
          "2$OM":
            desc: "Natural 5+ $OM_name in competition (5+ $OM_name, 8+ HCP)"
            rule: "8+hcp 5+$OM"
            priority: 1
            bids:
              "2$M":
                desc: "Opener rebids 6-card $M_name"
                rule: "6+$M"
                priority: 2
              "3$OM":
                desc: "Opener supports $OM_name with 3+ card fit (12-15 HCP)"
                rule: "3+$OM 12-15hcp"
                priority: 1
              "4$OM":
                desc: "Opener game in $OM_name (4+ $OM_name, 14+ HCP or low LTC)"
                rule: "4+$OM 14+hcp | 4-ltc 3+$OM"
                priority: 1
              2nt:
                desc: "Opener natural with Club stopper"
                rule: "1+c n#a|k|qc"
                priority: 2
              pass:
                desc: "Opener passes with minimum non-fitting hand"
                rule: "12-14hcp"
                priority: 10
          2nt:
            desc: "Natural invitational with Club stopper (10-12 HCP)"
            rule: "10-12hcp balanced 1+c n#a|k|qc"
            priority: 2
          3c:
            desc: "Cuebid: Limit Raise or better in $M_name (10+ HCP, 3+ $M_name)"
            rule: "10+hcp 3+$M"
            priority: 1
          "3$M":
            desc: "Preemptive / constructive raise to 3$M (4+ $M_name, 5-9 HCP)"
            rule: "5-9hcp 4+$M"
            priority: 3
          "4$M":
            desc: "Game to play in $M_name (4+ $M_name, 10+ HCP or extreme shape)"
            rule: "10+hcp 4+$M | 4+$M 1-c"
            priority: 1

      "(2d)":
        desc: "Interference 2D overcall"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
            bids:
              pass:
                desc: "West passes"
                bids:
                  dbl:
                    desc: "Opener reopening takeout double (short Diamonds, 12+ HCP)"
                    rule: "12+hcp 2-d"
                  "2$M":
                    desc: "Opener rebid 6+ $M_name (12-15 HCP)"
                    rule: "6+$M 12-15hcp"
                    priority: 2
                  "3$M":
                    desc: "Opener strong 6+ $M_name or low LTC (16+ HCP or 4-ltc)"
                    rule: "16+hcp 6+$M | 4-ltc 6+$M"
                    priority: 1
                  "4$M":
                    desc: "Opener extreme 8+ $M_name to play"
                    rule: "8+$M | 4-ltc 7+$M"
                    priority: 1
          dbl:
            desc: "Negative Double (specifically 4 $OM_name, 8+ HCP)"
            rule: "8+hcp 4=$OM"
            priority: 1
            bids:
              "2$M":
                desc: "Opener rebids 6-card $M_name"
                rule: "6+$M"
                priority: 2
              "2$OM":
                desc: "Opener accepts $OM_name with 4-card fit"
                rule: "4+$OM"
                priority: 1
              "3$M":
                desc: "Opener strong $M_name rebid"
                rule: "16+hcp 6+$M"
                priority: 1
              "4$M":
                desc: "Opener game in $M_name (extreme length or power)"
                rule: "8+$M | 4-ltc 7+$M"
                priority: 1
          "2$M":
            desc: "Simple raise to 2$M (3+ $M_name, 6-9 HCP)"
            rule: "6-9hcp 3+$M"
            priority: 2
            ref: "fGavinCompetitiveRaiseContinuations"
          "2$OM":
            desc: "Natural 5+ $OM_name in competition (5+ $OM_name, 8+ HCP)"
            rule: "8+hcp 5+$OM"
            priority: 1
            bids:
              "2$M":
                desc: "Opener rebids 6-card $M_name"
                rule: "6+$M"
                priority: 2
              "3$OM":
                desc: "Opener supports $OM_name with 3+ card fit (12-15 HCP)"
                rule: "3+$OM 12-15hcp"
                priority: 1
              "4$OM":
                desc: "Opener game in $OM_name (4+ $OM_name, 14+ HCP or low LTC)"
                rule: "4+$OM 14+hcp | 4-ltc 3+$OM"
                priority: 1
              2nt:
                desc: "Opener natural with Diamond stopper"
                rule: "1+d n#a|k|qd"
                priority: 2
              pass:
                desc: "Opener passes with minimum non-fitting hand"
                rule: "12-14hcp"
                priority: 10
          2nt:
            desc: "Natural invitational with Diamond stopper (10-12 HCP)"
            rule: "10-12hcp balanced 1+d n#a|k|qd"
            priority: 2
            bids:
              3nt:
                desc: "Opener accepts 3NT"
                rule: "14+hcp"
                priority: 2
              "4$M":
                desc: "Opener signs off in 4$M with long $M_name"
                rule: "6+$M"
                priority: 1
          3d:
            desc: "Cuebid: Limit Raise or better in $M_name (10+ HCP, 3+ $M_name)"
            rule: "10+hcp 3+$M"
            priority: 1
            bids:
              "3$M":
                desc: "Opener declines game invitation (minimum 12-13 HCP)"
                rule: "12-13hcp"
                priority: 2
              "4$M":
                desc: "Opener accepts game in $M_name (14+ HCP or low LTC)"
                rule: "14+hcp | 4-ltc | 8+$M"
                priority: 1
          "3$M":
            desc: "Preemptive / constructive raise to 3$M (4+ $M_name, 5-9 HCP)"
            rule: "5-9hcp 4+$M"
            priority: 3
            bids:
              pass:
                desc: "Opener passes with minimum"
                rule: "12-15hcp"
              "4$M":
                desc: "Opener game in $M_name"
                rule: "16+hcp | 4-ltc | 8+$M"
          "4$M":
            desc: "Game to play in $M_name (4+ $M_name, 10+ HCP or extreme shape)"
            rule: "10+hcp 4+$M | 4+$M 1-d"
            priority: 1

      "(2nt)":
        desc: "Interference Unusual 2NT overcall (showing both minors 5-5)"
        ref: "fUnusualOverUnusual_Major"

      "(2$M)":
        desc: "Michaels Cuebid over 1$M (showing other major + unspecified minor)"
        ref: "fMichaelsDefense_Major"
