        rule: "kc=1 h qh"
        priority: 1
        ref: "fSpecificKingResponses"
      7h:
        desc: "Grand slam in Hearts"
        rule: "kc=1 h qh"
        priority: 2

  fExclusionCaptainStep2_Hearts:
