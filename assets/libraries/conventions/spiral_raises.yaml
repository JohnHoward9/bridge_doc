library: "Spiral Raises"
description: "Gavin Wolpert Spiral Raises over 1m - 1M - 2M (step#1 ask over 2M: 2S over 2H, 2NT over 2S)"
version: "2.1"

imports:
  - "assets/libraries/conventions/rkcb_1430.yaml"
  - "assets/libraries/conventions/serious_3nt_and_kickback.yaml"

fragments:
  fSpiralRaises:
    aliases:
      - "fSpiralRaises_Heart"
      - "fSpiralRaises_Spade"
    desc: "Responder Continuations over 1m - 1$M - 2$M"
    bids:
      "step#1":
        desc: "Spiral Asking Bid (10+ HCP, 5+ $M_name or Game Forcing inquiry)"
        rule: "10+hcp 5+$M | 12+hcp"
        priority: 1
        bids:
          "step#1":
            desc: "Opener 3-card $M_name support, minimum (12-13 HCP)"
            rule: "12-13hcp 3=$M"
            priority: 2
            bids:
              "3$M":
                desc: "Signoff in 3$M with invitational values (10-11 HCP)"
                rule: "10-11hcp"
                priority: 2
              3nt:
                desc: "Game in 3NT with balanced game values"
                rule: "12+hcp balanced"
                priority: 1
              "4$M":
                desc: "Game in 4$M with 6+ $M_name"
                rule: "12+hcp 6+$M"
                priority: 1

          "step#2":
            desc: "Opener 3-card $M_name support, maximum (14-15 HCP)"
            rule: "14-15hcp 3=$M"
            priority: 2
            bids:
              "3$M":
                desc: "Signoff in 3$M"
                rule: "10-11hcp"
                priority: 2
              "4$M":
                desc: "Accept game in 4$M"
                rule: "10+hcp"
                priority: 1

          "step#3":
            desc: "Opener 4-card $M_name support, maximum (14-15 HCP)"
            rule: "14-15hcp 4+$M"
            priority: 1
            bids:
              4s:
                cond: "$M=h"
                desc: "Kickback RKCB 1430 for Hearts"
                agreedSuit: "h"
                rule: "15+hcp"
                priority: 1
                ref: "fKickbackHearts"
              4nt:
                cond: "$M=s"
                desc: "RKCB 1430 for Spades"
                agreedSuit: "s"
                rule: "15+hcp"
                priority: 1
                ref: "fRKCBResponses"
              "4$M":
                desc: "Game in 4$M"
                rule: "10-14hcp"
                priority: 2

          "step#4":
            desc: "Opener 4-card $M_name support, minimum (12-13 HCP)"
            rule: "12-13hcp 4+$M"
            priority: 2
            bids:
              4s:
                cond: "$M=h"
                desc: "Kickback RKCB 1430 for Hearts"
                agreedSuit: "h"
                rule: "16+hcp"
                priority: 1
                ref: "fKickbackHearts"
              4nt:
                cond: "$M=s"
                desc: "RKCB 1430 for Spades"
                agreedSuit: "s"
                rule: "16+hcp"
                priority: 1
                ref: "fRKCBResponses"
              "4$M":
                desc: "Game in 4$M with 12-15 HCP"
                rule: "12-15hcp"
                priority: 2

      "3$M":
        desc: "Direct invitational raise (10-11 HCP, 4-card $M_name raise)"
        rule: "10-11hcp 4=$M"
        priority: 3
        bids:
          "4$M":
            desc: "Accept invitation with 14-15 HCP"
            rule: "14-15hcp"
            priority: 1

      "4$M":
        desc: "Direct signoff in 4$M Game (12+ HCP, 5+ $M_name)"
        rule: "12+hcp 5+$M"
        priority: 2
