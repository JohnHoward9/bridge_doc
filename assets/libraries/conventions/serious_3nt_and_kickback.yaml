          7d:
            desc: "Grand slam in Diamonds"
            rule: "kc>=3 d qd"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 d"
            priority: 3

      4nt:
        desc: "Step 2: 0 or 3 Keycards"
        rule: "kc=0|3 d"
        priority: 1
        bids:
          5d:
            desc: "Signoff in Diamonds (missing 2 keycards)"
            rule: "kc=0 d"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=2 d"
            priority: 2
            ref: "fSpecificKingResponses"
          6d:
            desc: "Small slam in Diamonds (4 or 5 keycards combined)"
            rule: "kc>=1 d"
            priority: 1
          7d:
            desc: "Grand slam in Diamonds"
            rule: "kc>=2 d qd"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 d"
            priority: 3

      5c:
        desc: "Step 3: 2 Keycards without Queen of Diamonds"
        rule: "kc=2-q d"
        priority: 1
        bids:
          5d:
            desc: "Signoff in Diamonds"
            rule: "kc<=1 d"
            priority: 2
          5nt:
            desc: "King ask"
            rule: "kc>=3 d"
            priority: 2
          6d:
            desc: "Small slam in Diamonds"
            rule: "kc>=2 d"
            priority: 1
          7d:
            desc: "Grand slam in Diamonds"
            rule: "kc>=3 d qd"
            priority: 1
          pass:
            desc: "Signoff"
            rule: "kc<=1 d"
            priority: 3

      5d:
        desc: "Step 4: 2 Keycards with Queen of Diamonds"
        rule: "kc=2+q d"
        priority: 1
