library: "Smolen Convention"
description: "Smolen transfer after 1NT - 2C - 2D with 5-4 or 4-5 in the majors (10+ HCP GF)"
version: "1.0"

fragments:
  fSmolen:
    desc: "Smolen convention: responder jumps to 3 of the 4-card major ($M) so opener declares the 5-card major ($OM)"
    bids:
      "[3h,3s]":
        desc: "Smolen: 4-card $M_sym, 5-card $OM_sym, Game Forcing"
        rule: "10+hcp 4$M 5$OM [$OM=otherMajor($M)]"
        priority: 1
        bids:
          3s:
            desc: "Opener accepts Spades with 3-card fit (minimum 15 HCP)"
            rule: "3+s 15-hcp"
            cond: "$OM=s"
            priority: 1

          3nt:
            desc: "Opener signs off in 3NT (only 2 in $OM_sym)"
            rule: "2-$OM"
            priority: 2

          4s:
            desc: "Opener jumps to 4S game with 3-card fit and maximum"
            rule: "3+s 16+hcp"
            cond: "$OM=s"
            priority: 1

          4h:
            desc: "Opener accepts Hearts with 3-card fit"
            rule: "3+h"
            cond: "$OM=h"
            priority: 1
