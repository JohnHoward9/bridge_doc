library: "Kokish Relay"
description: "Kokish Relay structure over 2C opening: distinguishes 24+ balanced from Heart one-suiters via Kokish Flip (3C)"
version: "1.0"

imports:
  - "assets/libraries/conventions/serious_3nt_and_kickback.yaml"

fragments:
  fKokishRelay:
    desc: "Opener rebids after 2C - 2D waiting"
    bids:
      2h:
        desc: "Kokish Relay: forces 2S (either 25+ balanced or Heart one-suiter GF)"
        rule: "25+hcp balanced | 24+hcp balanced | 6+h gf | 20+hcp 6+h | 4-ltc 16+hcp 6+h | 22+hcp 6+h"
        priority: 1
        bids:
          2s:
            desc: "Forced puppet response"
            rule: "0+hcp"
            bids:
              2nt:
                desc: "Opener shows 25+ balanced (relay to Puppet Stayman & transfers)"
                rule: "25+hcp balanced | 24+hcp balanced"
                priority: 1
                ref: "fPuppetStayman2NT"

              3c:
                desc: "Kokish Flip: Opener shows a game-forcing Heart one-suiter"
                rule: "6+h gf | 20+hcp 6+h | 4-ltc 16+hcp 6+h | 22+hcp 6+h"
                priority: 1
                bids:
                  3h:
                    desc: "Responder fits Hearts"
                    rule: "2+h"
                  3nt:
                    desc: "Responder denies fit, choice of games"
                    rule: "1-h"

              3d:
                desc: "Natural 5+ Hearts and 4+ Diamonds GF"
                rule: "5+h 4+d gf | 20+hcp 5+h 4+d | 22+hcp 5+h 4+d"
                priority: 2

              3s:
                desc: "Natural 5+ Hearts and 4+ Spades GF"
                rule: "5+h 4+s gf | 20+hcp 5+h 4+s | 22+hcp 5+h 4+s"
                priority: 2

      2s:
        desc: "Natural game force: 5+ Spades"
        rule: "5+s gf | 20+hcp 5+s | 4-ltc 16+hcp 5+s | 22+hcp 5+s"
        priority: 2
        bids:
          3s:
            desc: "Support for Spades"
            rule: "3+s"
            priority: 2
            bids:
              4s:
                desc: "Game in Spades"
                rule: "22+hcp"
              4nt:
                ref: "fRKCBResponses"
          4s:
            desc: "Game in Spades"
            rule: "3+s"
            priority: 1
          2nt:
            desc: "Stopper ask / waiting without Spade fit"
            rule: "2-s"
            priority: 3
            bids:
              3nt:
                desc: "3NT to play"
                rule: "22+hcp balanced"
              4s:
                desc: "Game in Spades"
                rule: "6+s"
          3nt:
            desc: "To play"
            rule: "balanced 2-s"
            priority: 2

      2nt:
        desc: "Natural 22-24 balanced"
        rule: "22-24hcp balanced | 22-23hcp balanced"
        priority: 2
        ref: "fPuppetStayman2NT"

      3c:
        desc: "Natural game force: 5+ Clubs"
        rule: "5+c gf | 20+hcp 5+c | 4-ltc 16+hcp 5+c | 22+hcp 5+c"
        priority: 3
        bids:
          3d:
            desc: "Natural Diamonds (5+ Diamonds, GF)"
            rule: "5+d"
            priority: 1
            bids:
              4d:
                desc: "Opener fits Diamonds"
                rule: "3+d"
                priority: 1
                agreedSuit: "d"
                bids:
                  4h:
                    desc: "Kickback RKCB 1430 for Diamonds"
                    agreedSuit: "d"
                    rule: "4+d"
                    priority: 1
                    ref: "fKickbackDiamonds"
                  5d:
                    desc: "Game in Diamonds"
                    rule: "4+d"
                    priority: 2
                  6d:
                    desc: "Small Slam in Diamonds"
                    rule: "4+d 5+hcp"
                    priority: 1
              3nt:
                desc: "Opener choice of game 3NT"
                rule: "balanced | 2-d"
                priority: 2
          3h:
            desc: "Natural Hearts (5+ Hearts, GF)"
            rule: "5+h"
            priority: 1
          3s:
            desc: "Natural Spades (5+ Spades, GF)"
            rule: "5+s"
            priority: 1
          3nt:
            desc: "To play"
            rule: "0+hcp"
            priority: 3
          4c:
            desc: "Support for Clubs"
            rule: "3+c"
            priority: 1
            bids:
              4d:
                desc: "Kickback RKCB 1430 for Clubs"
                agreedSuit: "c"
                rule: "22+hcp"
                priority: 1
                ref: "fKickbackClubs"
              5c:
                desc: "Game in Clubs"
                rule: "22+hcp"
          5c:
            desc: "Game in Clubs"
            rule: "3+c"
            priority: 3

      3d:
        desc: "Natural game force: 5+ Diamonds"
        rule: "5+d gf | 20+hcp 5+d | 4-ltc 16+hcp 5+d | 22+hcp 5+d"
        priority: 3
        bids:
          3nt:
            desc: "To play"
            rule: "balanced"
            priority: 2
          4d:
            desc: "Support for Diamonds"
            rule: "3+d"
            priority: 1
            bids:
              4h:
                desc: "Kickback RKCB 1430 for Diamonds"
                agreedSuit: "d"
                rule: "22+hcp"
                priority: 1
                ref: "fKickbackDiamonds"
              5d:
                desc: "Game in Diamonds"
                rule: "22+hcp"
          5d:
            desc: "Game in Diamonds"
            rule: "3+d"
            priority: 3
