        priority: 1
        ref: "fGavinLimitRaiseResponses"

      3h:
        desc: "Mixed raise (6-9 HCP, 4-card support constructive)"
        rule: "p#2 6-9hcp 4+h"
        priority: 2

      3s:
        desc: "Splinter: Spade shortness (singleton/void, 10-13 HCP, 4+ Hearts)"
        rule: "p#1 10-13hcp 4+h 1-s [$M=h]"
        priority: 1
        ref: "fSplinterResponses"

