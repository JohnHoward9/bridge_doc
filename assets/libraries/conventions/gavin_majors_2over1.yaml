library: "Gavin Wolpert 5-Card Majors & 2/1 GF"
description: "Gavin Wolpert Major suit structure: 2D shows 5+, 2M rebid shows 6, Semi-Forcing 1NT, Jacoby 2NT, Mixed Raise (1x-3x), and Splinters"
version: "1.0"

imports:
  - "assets/libraries/conventions/reversed_bart.yaml"
  - "assets/libraries/conventions/jacoby_2nt.yaml"
  - "assets/libraries/conventions/two_way_checkback.yaml"
  - "assets/libraries/conventions/rkcb_1430.yaml"
  - "assets/libraries/conventions/serious_3nt_and_kickback.yaml"

fragments:
  GavinHeartOpening:
    aliases: ["fGavinHeartResponses", "fGavinMajors1HResponses"]
    desc: "Gavin 5+ Hearts opening (12-21 HCP)"
    rule: "12-21hcp, 5+h, h>=s [$M=h, $OM=s]"
    bids:
      pass:
        desc: "Pass (0-5 HCP)"
        rule: "p#10 5-hcp"
        priority: 10

      1s:
        desc: "Natural 4+ Spades forcing 1 round"
        rule: "p#2 6+hcp 4+s"
        priority: 2
        bids:
          1nt:
            desc: "Balanced minimum without 4 Spades"
            rule: "12-14hcp 3-s"
            ref: "fThreeWayCheckback"
          2c:
            desc: "Natural secondary Clubs"
            rule: "3+c"
          2d:
            desc: "Natural secondary Diamonds"
            rule: "3+d"
          2h:
            desc: "Rebid 6-card Hearts"
            rule: "6+h 12-15hcp"
          2s:
            desc: "Raise Spades with 4-card support"
            rule: "4+s 12-15hcp"
            bids:
              pass:
                desc: "Pass with minimum 6-9 HCP"
                rule: "p#10 6-9hcp"
                priority: 10
              3s:
                desc: "Invitational with 10-11 HCP"
                rule: "p#2 10-11hcp"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with 12-13 HCP"
                    rule: "12-13hcp"
                  4s:
                    desc: "Accept game with 14-15 HCP"
                    rule: "14-15hcp"
                    priority: 1
              4s:
                desc: "Game with 12+ HCP"
                rule: "p#1 12+hcp"
                priority: 1
          3h:
            desc: "Invitational 6+ Hearts"
            rule: "6+h 16-17hcp"
            bids:
              pass:
                desc: "Decline with 6-7 HCP"
                rule: "p#10 6-7hcp"
                priority: 10
              4h:
                desc: "Accept with 8+ HCP and 2+ Hearts"
                rule: "p#1 8+hcp 2+h"
                priority: 1
              3nt:
                desc: "Accept with 8+ HCP without Heart fit"
                rule: "p#2 8+hcp 1-h | p#2 8+hcp"
                priority: 2
          4h:
            desc: "To play"
            rule: "6+h 18-20hcp"

      1nt:
        desc: "Semi-forcing 1NT (6-11 HCP, may hold 3-card limit raise)"
        rule: "p#3 6-11hcp 3-s"
        priority: 3
        bids:
          pass:
            desc: "Opener passes with 12-14 balanced"
            rule: "12-14hcp balanced"
          2c:
            desc: "Opener natural minor or minimum"
            rule: "3+c 12-15hcp"
            bids:
              pass:
                desc: "Pass to play in Clubs (weak clubs)"
                rule: "p#10 5+c 5-8hcp"
                priority: 10
              2d:
                desc: "Natural signoff in Diamonds"
                rule: "p#3 5+d 5-8hcp"
                priority: 3
              2h:
                desc: "Preference to Hearts (2-card support, 5-8 HCP)"
                rule: "p#2 2h 5-8hcp"
                priority: 2
              2s:
                desc: "Invitational with 5+ Spades (non-forcing)"
                rule: "p#2 5+s 9-11hcp"
                priority: 2
              2nt:
                desc: "Natural balanced invitation (9-11 HCP)"
                rule: "p#3 9-11hcp balanced"
                priority: 3
              3c:
                desc: "Invitational Club raise (4+ Clubs, 9-11 HCP)"
                rule: "p#3 4+c 9-11hcp"
                priority: 3
              3h:
                desc: "Invitational Heart raise (3-card limit raise, 10-11 HCP)"
                rule: "p#2 3h 10-11hcp"
                priority: 2
          2d:
            desc: "Opener natural Diamonds"
            rule: "3+d 12-15hcp"
          2h:
            desc: "Opener rebids 6-card Hearts (guarantees 6 cards)"
            rule: "6+h 12-15hcp"
          2nt:
            desc: "Opener balanced invitation (18-19 HCP)"
            rule: "18-19hcp balanced"
            bids:
              pass:
                desc: "Decline invitation with 6-7 HCP"
                rule: "p#10 6-7hcp"
                priority: 10
              3nt:
                desc: "Accept invitation with 8-11 HCP"
                rule: "p#1 8-11hcp"
                priority: 1
              3h:
                desc: "Preference with 3-card Heart support"
                rule: "p#2 3h 6-8hcp"
                priority: 2
              4h:
                desc: "Game in Hearts with 3-card support and maximum"
                rule: "p#1 3h 9-11hcp"
                priority: 1
          3h:
            desc: "Opener 6+ card Heart invitation (16-18 HCP)"
            rule: "6+h 16-18hcp"
            bids:
              pass:
                desc: "Decline with 6-7 HCP and 0-1 support"
                rule: "p#10 6-7hcp 1-h"
                priority: 10
              4h:
                desc: "Accept game with 8+ HCP or 2+ support"
                rule: "p#1 8+hcp"
                priority: 1
          4h:
            desc: "Opener to play in game (19-21 HCP, 6+ Hearts)"
            rule: "6+h 19+hcp"

      2c:
        desc: "Nebulous 2C / 2/1 GF: Natural Clubs (4+ Clubs) or Balanced GF (2+ Clubs, 10+ HCP, denies 4S)"
        rule: "p#2 10+hcp 2+c 3-s [$M=h]"
        priority: 2
        bids:
          2d:
            desc: "Natural Diamonds"
            rule: "4+d"
            ref: "fGavin2Over1Continuations"
          2h:
            desc: "Opener rebids 6-card Hearts (guarantees 6 cards)"
            rule: "6+h"
            ref: "fGavin2Over1MajorRebidContinuations"
          2s:
            desc: "Reverse showing 4+ Spades and 16+ HCP"
            rule: "4+s 16+hcp"
            ref: "fGavin2Over1Continuations"
          2nt:
            desc: "Balanced 12-14 or 18-19 HCP"
            rule: "balanced"
            ref: "fGavin2Over1Continuations"
          3c:
            desc: "Opener fits Clubs (4+ Clubs)"
            rule: "4+c"
            ref: "fGavin2Over1Continuations"

      2d:
        desc: "2/1 Game Force in Diamonds (10+ HCP, GUARANTEES 5+ Diamonds)"
        rule: "p#1 10+hcp 5+d [$M=h]"
        priority: 1
        bids:
          2h:
            desc: "Opener rebids 6-card Hearts (guarantees 6 cards)"
            rule: "6+h"
            ref: "fGavin2Over1MajorRebidContinuations"
          2s:
            desc: "Reverse showing 4+ Spades and 16+ HCP"
            rule: "4+s 16+hcp"
            ref: "fGavin2Over1Continuations"
          2nt:
            desc: "Balanced stopper ask"
            rule: "balanced"
            ref: "fGavin2Over1Continuations"
          3d:
