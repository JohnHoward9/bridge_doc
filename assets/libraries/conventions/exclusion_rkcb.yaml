        desc: "Small slam in 6H (Partner has 1 KC + Captain's 3 KC = all 4 Keycards)"
        rule: "kc=3 h"
        priority: 1
      5nt:
        desc: "King ask / Grand slam try"
        rule: "kc=3 h qh"
        priority: 1
