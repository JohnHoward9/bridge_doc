library: "Support Doubles & Redoubles"
description: "Support Doubles and Redoubles in competition through 2 of Responder's major to show exactly 3-card support"
version: "2.1"

fragments:
  fSupportDoubleAction:
    desc: "Support Double / Raise action over interference"
    bids:
      dbl:
        desc: "Support Double: Exactly 3-card $M_name support (12-18 HCP)"
        rule: "12-18hcp 3=$M"
        priority: 1
      "2$M":
        desc: "Raise $M_name: 4-card support (12-15 HCP)"
        rule: "12-15hcp 4+$M"
        priority: 2

  fSupportDoubles:
    aliases:
      - "fSupportDoubles_Heart"
      - "fSupportDoubles_Spade"
    desc: "Competitive continuations after 1m - (P) - 1$M - (Interference)"
    bids:
      "(1s)":
        cond: "$M=h"
        desc: "Overcall 1S by opponent"
        ref: "fSupportDoubleAction"
      "(2c)":
        desc: "Overcall 2C by opponent"
        ref: "fSupportDoubleAction"
      "(2d)":
        desc: "Overcall 2D by opponent"
        ref: "fSupportDoubleAction"
      "(2h)":
        cond: "$M=s"
        desc: "Overcall 2H by opponent"
        ref: "fSupportDoubleAction"
      "(x)":
        desc: "Takeout Double by opponent"
        bids:
          rdbl:
            desc: "Support Redouble: Exactly 3-card $M_name support (12+ HCP)"
            rule: "12+hcp 3=$M"
            priority: 1
          "2$M":
            desc: "Raise $M_name: 4-card support (12-15 HCP)"
            rule: "12-15hcp 4+$M"
            priority: 2
