      2d:
        desc: "Waiting / artificial negative (0-7 HCP or general positive)"
        rule: "0+hcp"
        ref: "fKokishRelay"
      2h:
        desc: "Positive natural (5+ Hearts, 8+ HCP, game forcing)"
        rule: "8+hcp 5+h"
        priority: 2
        bids:
          3h:
            desc: "Fit Hearts"
            rule: "3+h"
            bids:
              4h:
                desc: "Game in Hearts"
                rule: "8+hcp"
              4nt:
                ref: "fRKCBResponses"
          4h:
            desc: "Game in Hearts"
            rule: "3+h"
          3nt:
            desc: "3NT to play"
            rule: "balanced 2-h"
