library: "Suit Overcalls, Takeout Doubles & Two-Suited Overcalls"
description: "Comprehensive 1-level and 2-level defense over opponent 1m and 1M suit openings: Natural Overcalls, Takeout Doubles, 1NT Overcall, Unusual 2NT, and Michaels Cuebid."
version: "1.0"

fragments:
  fOneLevelMinorDefense:
    desc: "Opposition 1 $om_name Opening (3+ $om_name, 11-21 HCP)"
    rule: "11-21hcp 3+$om [$om=$om]"
    priority: 1
    aliases: ["fOneLevelClubDefense", "fOneLevelDiamondDefense"]
    bids:
      # 1-level natural overcalls
      1d:
        desc: "Natural Diamond overcall (8-16 HCP, 5+ Diamonds)"
        rule: "8-16hcp 5+d"
        cond: "$om=c"
        priority: 3
        bids:
          pass:
            desc: "Pass (advancer minimum)"
            rule: "0-8hcp"
          1h:
            desc: "Natural 4+ Hearts (8+ HCP)"
            rule: "8+hcp 4+h"
          1s:
            desc: "Natural 4+ Spades (8+ HCP)"
            rule: "8+hcp 4+s"
          2d:
            desc: "Constructive Diamond raise (8-10 HCP, 3+ Diamonds)"
            rule: "8-10hcp 3+d"
          3d:
            desc: "Preemptive Diamond raise (4+ Diamonds, weak)"
            rule: "4-7hcp 4+d"

      "[1h,1s]":
        desc: "Natural Major overcall (8-16 HCP, 5+ Major)"
        rule: "8-16hcp 5+%"
        priority: 3
        bids:
          pass:
            desc: "Pass (advancer minimum)"
            rule: "0-8hcp"
          2nt:
            desc: "Invitational major raise (10-12 HCP, 3+ card support)"
            rule: "10-12hcp 3+%"
          "[2h,2s]":
            desc: "Simple major raise (8-10 HCP, 3+ card support)"
            rule: "8-10hcp 3+%"
          "[3h,3s]":
            desc: "Preemptive major raise (4+ card support, 4-7 HCP)"
            rule: "4-7hcp 4+%"
          "[4h,4s]":
            desc: "Game to play (10+ HCP or long trump shape)"
            rule: "10+hcp 4+%"

      # 1NT Overcall: 15-18 HCP balanced with stopper in $om
      1nt:
        desc: "1NT Overcall: 15-18 HCP balanced with stopper in opponent's minor"
        rule: "15-18hcp $bal n#a|k$om"
        priority: 2
        ref: "fGavin1NTResponses"

      # Takeout Double
      dbl:
        desc: "Takeout Double (12+ HCP with shortness in $om and tolerance for unbid suits, or 17+ HCP any shape)"
        rule: "12+hcp 2-$om | 17+hcp"
        priority: 4
        bids:
          pass:
            desc: "Penalty pass (holding length and strong honors in $om)"
            rule: "4+$om 8+hcp"
            priority: 1
          1d:
            desc: "Advancer Diamond response (0-8 HCP)"
            rule: "0-8hcp 4+d"
            priority: 4
          1h:
            desc: "Advancer Heart response (0-8 HCP)"
            rule: "0-8hcp 4+h"
            priority: 4
          1s:
            desc: "Advancer Spade response (0-8 HCP)"
            rule: "0-8hcp 4+s"
            priority: 4
          1nt:
            desc: "Natural 1NT with stopper in $om (7-10 HCP)"
            rule: "7-10hcp n#a|k$om"
            priority: 3
          2h:
            desc: "Constructive Heart response (9-11 HCP, 4+ Hearts)"
            rule: "9-11hcp 4+h"
            priority: 2
          2s:
            desc: "Constructive Spade response (9-11 HCP, 4+ Spades)"
            rule: "9-11hcp 4+s"
            priority: 2
          "2$om":
            desc: "Cuebid of opponent's minor: Game forcing inquiry (12+ HCP)"
            rule: "12+hcp"
            priority: 2

      # Michaels Cuebid over 1m: 5-5 in Both Majors
      "2$om":
        desc: "Michaels Cuebid: 5-5 in both Majors (6-11 or 16+ HCP)"
        rule: "6-11hcp 5+h 5+s | 16+hcp 5+h 5+s"
        priority: 1
        bids:
          2h:
            desc: "Preference for Hearts (to play, 0-9 HCP)"
            rule: "0-9hcp h>=s"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              3h:
                desc: "Invitational raise in Hearts (15-17 HCP, 5+ Hearts)"
                rule: "15-17hcp 5+h"
                priority: 1
              4h:
                desc: "Game in Hearts (18+ HCP, 5+ Hearts)"
                rule: "18+hcp 5+h"
                priority: 1
          2s:
            desc: "Preference for Spades (to play, 0-9 HCP)"
            rule: "0-9hcp s>h"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              3s:
                desc: "Invitational raise in Spades (15-17 HCP, 5+ Spades)"
                rule: "15-17hcp 5+s"
                priority: 1
              4s:
                desc: "Game in Spades (18+ HCP, 5+ Spades)"
                rule: "18+hcp 5+s"
                priority: 1
          2nt:
            desc: "Game try / inquiry (10+ HCP, forcing)"
            rule: "10+hcp"
            bids:
              "3$om":
                desc: "Minimum 6-11 HCP"
                rule: "6-11hcp"
                priority: 2
              3h:
                desc: "Invitational with longer Hearts (15-17 HCP)"
                rule: "15-17hcp"
                priority: 1
              3s:
                desc: "Invitational with longer Spades (15-17 HCP)"
                rule: "15-17hcp"
                priority: 1
              4h:
                desc: "Game in Hearts (18+ HCP)"
                rule: "18+hcp"
                priority: 1
              4s:
                desc: "Game in Spades (18+ HCP)"
                rule: "18+hcp"
                priority: 1
          "3$om":
            desc: "Cuebid of opponent's minor: Game-forcing inquiry (12+ HCP)"
            rule: "12+hcp"
            priority: 1
          3h:
            desc: "Invitational raise in Hearts (10-12 HCP, 3+ Hearts)"
            rule: "10-12hcp 3+h"
            bids:
              pass:
                desc: "Decline invitation with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4h:
                desc: "Accept game in Hearts (16+ HCP)"
                rule: "16+hcp"
                priority: 1
          3s:
            desc: "Invitational raise in Spades (10-12 HCP, 3+ Spades)"
            rule: "10-12hcp 3+s"
            bids:
              pass:
                desc: "Decline invitation with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4s:
                desc: "Accept game in Spades (16+ HCP)"
                rule: "16+hcp"
                priority: 1
          4h:
            desc: "Game in Hearts (10+ HCP or distributional fit)"
            rule: "10+hcp 4+h | 4+h 1-c 1-d"
            priority: 1
          4s:
            desc: "Game in Spades (10+ HCP or distributional fit)"
            rule: "10+hcp 4+s | 4+s 1-c 1-d"
            priority: 1

      # Unusual 2NT over 1m: 5-5 in Hearts + other minor (6-11 or 16+ HCP)
      2nt:
        desc: "Unusual 2NT: 5-5 in Hearts and other minor (6-11 or 16+ HCP)"
        rule: "6-11hcp 5+h | 16+hcp 5+h"
        priority: 1
        bids:
          3c:
            cond: "$om=d"
            desc: "Preference for Clubs (to play, 0-9 HCP)"
            rule: "0-9hcp c>=h"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4c:
                desc: "Invitational raise in Clubs (15-17 HCP, 5+ Clubs)"
                rule: "15-17hcp 5+c"
                priority: 1
              5c:
                desc: "Game in Clubs (18+ HCP, 5+ Clubs)"
                rule: "18+hcp 5+c"
                priority: 1
          3d:
            cond: "$om=c"
            desc: "Preference for Diamonds (to play, 0-9 HCP)"
            rule: "0-9hcp d>=h"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4d:
                desc: "Invitational raise in Diamonds (15-17 HCP, 5+ Diamonds)"
                rule: "15-17hcp 5+d"
                priority: 1
              5d:
                desc: "Game in Diamonds (18+ HCP, 5+ Diamonds)"
                rule: "18+hcp 5+d"
                priority: 1
          3h:
            desc: "Preference for Hearts (to play, 0-9 HCP)"
            rule: "0-9hcp 3+h"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4h:
                desc: "Game in Hearts (15+ HCP, 5+ Hearts)"
                rule: "15+hcp 5+h"
                priority: 1
          "3$om":
            desc: "Cuebid of opponent's minor: Game-forcing inquiry (11+ HCP)"
            rule: "11+hcp"
            priority: 1
          3s:
            desc: "Natural 5+ Spades, constructive / forcing (10+ HCP)"
            rule: "10+hcp 5+s"
            priority: 2
          3nt:
            desc: "Natural 3NT to play with stoppers in unbid suits (11-13 HCP)"
            rule: "11-13hcp balanced"
            priority: 1
          4h:
            desc: "Game in Hearts to play (10+ HCP, 4+ Hearts)"
            rule: "10+hcp 4+h"
            priority: 1

  fOneLevelMajorDefense:
    desc: "Opposition 1 $M_name Opening (5+ $M_name, 11-21 HCP)"
    rule: "11-21hcp 5+$M [$om=$M, $OM=otherMajor($M)]"
    priority: 1
    aliases: ["fOneLevelHeartDefense", "fOneLevelSpadeDefense"]
    bids:
      # 1S overcall over 1H
      1s:
        desc: "Natural Spade overcall (8-16 HCP, 5+ Spades)"
        rule: "8-16hcp 5+s"
        cond: "$om=h"
        priority: 3
        bids:
          pass:
            desc: "Pass (advancer minimum)"
            rule: "0-8hcp"
          2s:
            desc: "Simple Spade raise (8-10 HCP, 3+ Spades)"
            rule: "8-10hcp 3+s"
          3s:
            desc: "Preemptive Spade raise (4-7 HCP, 4+ Spades)"
            rule: "4-7hcp 4+s"
          4s:
            desc: "Game to play (10+ HCP, 4+ Spades)"
            rule: "10+hcp 4+s"

      # 2-level minor overcalls (sound values: 10-16 HCP, 5+ cards)
      "[2c,2d]":
        desc: "Natural 2-level minor overcall (10-16 HCP, 5+ Minor)"
        rule: "10-16hcp 5+%"
        priority: 3
        bids:
          pass:
            desc: "Pass"
            rule: "0-8hcp"
          "[3c,3d]":
            desc: "Constructive minor raise (8-10 HCP, 3+ cards)"
            rule: "8-10hcp 3+%"

      # 1NT Overcall: 15-18 HCP balanced with stopper in $om
      1nt:
        desc: "1NT Overcall: 15-18 HCP balanced with stopper in opponent's major"
        rule: "15-18hcp $bal n#a|k$om"
        priority: 2
        ref: "fGavin1NTResponses"

      # Takeout Double
      dbl:
        desc: "Takeout Double (12+ HCP with shortness in $om and 3+ in unbid suits, or 17+ HCP any shape)"
        rule: "12+hcp 2-$om | 17+hcp"
        priority: 4
        bids:
          pass:
            desc: "Penalty pass (holding length and strong honors in $om)"
            rule: "4+$om 8+hcp"
            priority: 1
          1s:
            desc: "Natural 4+ Spades over 1H (0-8 HCP)"
            rule: "0-8hcp 4+s"
            priority: 4
          "[2c,2d]":
            desc: "Cheapest minor response (0-8 HCP, 4+ cards)"
            rule: "0-8hcp 4+%"
            priority: 4
          "2$OM":
            desc: "Constructive other major response (9-11 HCP, 4+ cards)"
            rule: "9-11hcp 4+$OM"
            priority: 2
          1nt:
            desc: "Natural 1NT with stopper in $om (7-10 HCP)"
            rule: "7-10hcp n#a|k$om"
            priority: 3
          "2$om":
            desc: "Cuebid of opponent's major: Game forcing inquiry (12+ HCP)"
            rule: "12+hcp"
            priority: 2

      # Michaels Cuebid over 1M: 5-5 in Other Major and an Unspecified Minor
      "2$om":
        desc: "Michaels Cuebid: 5-5 in other Major ($OM) and an unspecified minor (6-11 or 16+ HCP)"
        rule: "6-11hcp 5+$OM 5+c | 6-11hcp 5+$OM 5+d | 16+hcp 5+$OM 5+c | 16+hcp 5+$OM 5+d"
        priority: 1
        bids:
          "2$OM":
            desc: "Preference for the other major (to play, 0-9 HCP)"
            rule: "0-9hcp 3+$OM"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              "3$OM":
                desc: "Invitational raise in the other major (15-17 HCP, 5+ $OM_name)"
                rule: "15-17hcp 5+$OM"
                priority: 1
              "4$OM":
                desc: "Game in the other major (18+ HCP, 5+ $OM_name)"
                rule: "18+hcp 5+$OM"
                priority: 1
          2nt:
            desc: "Inquiry asking for partner's minor (forcing, 10+ HCP)"
            rule: "10+hcp"
            bids:
              3c:
                desc: "Clubs is the minor, minimum (6-11 HCP)"
                rule: "6-11hcp 5+c"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with Club preference (0-10 HCP)"
                    rule: "0-10hcp"
                    priority: 10
                  "3$OM":
                    desc: "Signoff in other major with extra major length"
                    rule: "0-10hcp 4+$OM"
                    priority: 2
                  3nt:
                    desc: "3NT to play with stoppers in opponent's major"
                    rule: "11-13hcp"
                    priority: 1
                  "4$OM":
                    desc: "Game in the other major"
                    rule: "11+hcp 4+$OM"
                    priority: 1
                  5c:
                    desc: "Game in Clubs"
                    rule: "11+hcp 4+c"
                    priority: 1
              3d:
                desc: "Diamonds is the minor, minimum (6-11 HCP)"
                rule: "6-11hcp 5+d"
                priority: 2
                bids:
                  pass:
                    desc: "Pass with Diamond preference (0-10 HCP)"
                    rule: "0-10hcp"
                    priority: 10
                  "3$OM":
                    desc: "Signoff in other major with extra major length"
                    rule: "0-10hcp 4+$OM"
                    priority: 2
                  3nt:
                    desc: "3NT to play with stoppers in opponent's major"
                    rule: "11-13hcp"
                    priority: 1
                  "4$OM":
                    desc: "Game in the other major"
                    rule: "11+hcp 4+$OM"
                    priority: 1
                  5d:
                    desc: "Game in Diamonds"
                    rule: "11+hcp 4+d"
                    priority: 1
              "3$om":
                desc: "Clubs is the minor, maximum (16+ HCP)"
                rule: "16+hcp 5+c"
                priority: 1
              3nt:
                desc: "Diamonds is the minor, maximum (16+ HCP)"
                rule: "16+hcp 5+d"
                priority: 1
          3c:
            desc: "Pass or Correct: preference for overcaller's minor (0-9 HCP)"
            rule: "0-9hcp 3+c 3+d"
            bids:
              pass:
                desc: "Overcaller holds Clubs"
                rule: "5+c"
                priority: 1
              3d:
                desc: "Overcaller corrects to Diamonds"
                rule: "5+d"
                priority: 1
          "3$om":
            desc: "Cuebid of opponent's major: Game-forcing inquiry (12+ HCP)"
            rule: "12+hcp"
            priority: 1
          "3$OM":
            desc: "Invitational raise in the other major (10-12 HCP, 3+ cards)"
            rule: "10-12hcp 3+$OM"
            bids:
              pass:
                desc: "Decline invitation with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              "4$OM":
                desc: "Accept game in other major (16+ HCP)"
                rule: "16+hcp"
                priority: 1
          "4$OM":
            desc: "Game to play in the other major"
            rule: "10+hcp 4+$OM"
            priority: 1

      # Unusual 2NT over 1M: 5-5 in Both Minors (Clubs and Diamonds)
      2nt:
        desc: "Unusual 2NT: 5-5 in both minors (Clubs and Diamonds, 6-11 or 16+ HCP)"
        rule: "6-11hcp 5+c 5+d | 16+hcp 5+c 5+d"
        priority: 1
        bids:
          3c:
            desc: "Preference for Clubs (to play, 0-9 HCP)"
            rule: "0-9hcp c>=d"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4c:
                desc: "Invitational raise in Clubs (15-17 HCP, 5+ Clubs)"
                rule: "15-17hcp 5+c"
                priority: 1
              5c:
                desc: "Game in Clubs (18+ HCP, 5+ Clubs)"
                rule: "18+hcp 5+c"
                priority: 1
          3d:
            desc: "Preference for Diamonds (to play, 0-9 HCP)"
            rule: "0-9hcp d>c"
            bids:
              pass:
                desc: "Pass with minimum (6-11 HCP)"
                rule: "6-11hcp"
                priority: 10
              4d:
                desc: "Invitational raise in Diamonds (15-17 HCP, 5+ Diamonds)"
                rule: "15-17hcp 5+d"
                priority: 1
              5d:
                desc: "Game in Diamonds (18+ HCP, 5+ Diamonds)"
                rule: "18+hcp 5+d"
                priority: 1
          "3$om":
            desc: "Cuebid of opponent's major: Game-forcing inquiry (11+ HCP)"
            rule: "11+hcp"
            priority: 1
          "3$OM":
            desc: "Natural 5+ in other major, constructive / forcing (10+ HCP)"
            rule: "10+hcp 5+$OM"
            priority: 2
          3nt:
            desc: "Natural 3NT to play with stoppers in opponent's major (11-13 HCP)"
            rule: "11-13hcp 1+$om n#a|k|q$om"
            priority: 1
          4c:
            desc: "Preemptive / competitive club raise (4+ Clubs, 6-9 HCP)"
            rule: "6-9hcp 4+c"
            priority: 2
          4d:
            desc: "Preemptive / competitive diamond raise (4+ Diamonds, 6-9 HCP)"
            rule: "6-9hcp 4+d"
            priority: 2
          5c:
            desc: "Game in Clubs to play"
            rule: "10+hcp 4+c"
            priority: 1
          5d:
            desc: "Game in Diamonds to play"
            rule: "10+hcp 4+d"
            priority: 1

  # =========================================================================
  # OPPOSITION DEFENSE FRAGMENTS (Gavin Wolpert: Dealing with Michaels & 2NT)
  # =========================================================================

  fUnusualOverUnusual_Major:
    desc: "Unusual over Unusual defense over opponent (2NT) overcall (Lower-Lower, Higher-Higher)"
    bids:
      - call: pass
        desc: "Pass (0-7 HCP)"
        rule: "0-7hcp"
        priority: 10
      - call: dbl
        desc: "Penalty Double / values (10+ HCP, defense in at least one minor)"
        rule: "10+hcp"
        priority: 1
      - call: 3c
        cond: "$M=s"
        desc: "Lower Cuebid: 5+ Hearts, Game Forcing (10+ HCP)"
        rule: "10+hcp 5+h"
        priority: 1
      - call: 3d
        cond: "$M=s"
        desc: "Higher Cuebid: Limit raise or better in Spades (10+ HCP, 3+ Spades)"
        rule: "10+hcp 3+s"
        priority: 1
      - call: 3c
        cond: "$M=h"
        desc: "Lower Cuebid: Limit raise or better in Hearts (10+ HCP, 3+ Hearts)"
        rule: "10+hcp 3+h"
        priority: 1
      - call: 3d
        cond: "$M=h"
        desc: "Higher Cuebid: 5+ Spades, Game Forcing (10+ HCP)"
        rule: "10+hcp 5+s"
        priority: 1
      - call: 3h
        cond: "$M=s"
        desc: "Natural Hearts, non-forcing / competitive (5-9 HCP, 5+ Hearts)"
        rule: "5-9hcp 5+h"
        priority: 2
      - call: 3s
        cond: "$M=h"
        desc: "Natural Spades, non-forcing / competitive (5-9 HCP, 5+ Spades)"
        rule: "5-9hcp 5+s"
        priority: 2
      - call: "3$M"
        desc: "Simple competitive raise (3+ $M_name, 5-9 HCP)"
        rule: "5-9hcp 3+$M"
        priority: 2
      - call: 3nt
        desc: "Natural 3NT to play with stoppers in minors (10-12 HCP)"
        rule: "10-12hcp n#a|k|qc n#a|k|qd"
        priority: 1
      - call: "4$M"
        desc: "Game to play in $M_name (4+ $M_name, 10+ HCP or preemptive)"
        rule: "10+hcp 4+$M | 0-7hcp 5+$M"
        priority: 1

  fUnusualOverUnusual_Spades:
    desc: "Unusual over Unusual defense over opponent (2NT) overcall after 1S opening"
    bids:
      pass:
        desc: "Pass (0-7 HCP)"
        rule: "0-7hcp"
        priority: 10
      dbl:
        desc: "Penalty Double / values (10+ HCP, defense in at least one minor)"
        rule: "10+hcp"
        priority: 1
      3c:
        desc: "Lower Cuebid: 5+ Hearts, Game Forcing (10+ HCP)"
        rule: "10+hcp 5+h"
        priority: 1
      3d:
        desc: "Higher Cuebid: Limit raise or better in Spades (10+ HCP, 3+ Spades)"
        rule: "10+hcp 3+s"
        priority: 1
      3h:
        desc: "Natural Hearts, non-forcing / competitive (5-9 HCP, 5+ Hearts)"
        rule: "5-9hcp 5+h"
        priority: 2
      3s:
        desc: "Simple competitive raise in Spades (3+ Spades, 5-9 HCP)"
        rule: "5-9hcp 3+s"
        priority: 2
      3nt:
        desc: "Natural 3NT to play with stoppers in minors (10-12 HCP)"
        rule: "10-12hcp n#a|k|qc n#a|k|qd"
        priority: 1
      4s:
        desc: "Game to play in Spades (4+ Spades, 10+ HCP or preemptive)"
        rule: "10+hcp 4+s | 0-7hcp 5+s"
        priority: 1

  fUnusualOverUnusual_Hearts:
    desc: "Unusual over Unusual defense over opponent (2NT) overcall after 1H opening"
    bids:
      pass:
        desc: "Pass (0-7 HCP)"
        rule: "0-7hcp"
        priority: 10
      dbl:
        desc: "Penalty Double / values (10+ HCP, defense in at least one minor)"
        rule: "10+hcp"
        priority: 1
      3c:
        desc: "Lower Cuebid: Limit raise or better in Hearts (10+ HCP, 3+ Hearts)"
        rule: "10+hcp 3+h"
        priority: 1
      3d:
        desc: "Higher Cuebid: 5+ Spades, Game Forcing (10+ HCP)"
        rule: "10+hcp 5+s"
        priority: 1
      3h:
        desc: "Simple competitive raise in Hearts (3+ Hearts, 5-9 HCP)"
        rule: "5-9hcp 3+h"
        priority: 2
      3s:
        desc: "Natural Spades, non-forcing / competitive (5-9 HCP, 5+ Spades)"
        rule: "5-9hcp 5+s"
        priority: 2
      3nt:
        desc: "Natural 3NT to play with stoppers in minors (10-12 HCP)"
        rule: "10-12hcp n#a|k|qc n#a|k|qd"
        priority: 1
      4h:
        desc: "Game to play in Hearts (4+ Hearts, 10+ HCP or preemptive)"
        rule: "10+hcp 4+h | 0-7hcp 5+h"
        priority: 1

  fMichaelsDefense_Major:
    desc: "Defense against Michaels Cuebid (2$M) over 1$M opening"
    bids:
      pass:
        desc: "Pass (0-7 HCP)"
        rule: "0-7hcp"
        priority: 10
      dbl:
        desc: "Penalty Double / values (10+ HCP, penalty interest against other major)"
        rule: "10+hcp"
        priority: 1
      2nt:
