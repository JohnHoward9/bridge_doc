name: "Natural Minor Openings with Inverted Minors"
desc: "Standard 1C and 1D responses incorporating inverted minor raises and Walsh/natural major suit priority"

fragments:
  fNaturalMinorResponses:
    aliases:
      - "fNaturalClubResponses"
      - "fNaturalDiamondResponses"
    desc: "Responses to Natural 1$m Opening"
    bids:
      1d:
        cond: "$m=c"
        desc: "Natural 4+ Diamonds (6+ HCP)"
        rule: "6+hcp, 4+d"
        priority: 4
      1h:
        desc: "Natural 4+ Hearts (6+ HCP)"
        rule: "6+hcp, 4+h"
        priority: 3
      1s:
        desc: "Natural 4+ Spades (6+ HCP)"
        rule: "6+hcp, 4+s"
        priority: 3
      1nt:
        desc: "Balanced 6-10 without 4-card major"
        rule: "6-10hcp, balanced, 3-h, 3-s"
        priority: 5
      2c:
        cond: "$m=d"
        desc: "2/1 Game Force in Clubs (12+ HCP, 4+ Clubs)"
        rule: "12+hcp, 4+c"
        priority: 2
      "2$m":
        desc: "Inverted Minor: 10+ HCP 4+ $m_name, forcing 1 round"
        rule: "10+hcp, 4+$m, 3-h, 3-s"
        priority: 2
      2nt:
        desc: "Invitational 11-12 balanced without 4-card major"
        rule: "11-12hcp, balanced, 3-h, 3-s"
        priority: 3
      "3$m":
        desc: "Preemptive / weak 5+ $m_name raise (4-9 HCP)"
        rule: "4-9hcp, 5+$m, 3-h, 3-s"
        priority: 3
      3nt:
        desc: "To play (13-15 HCP balanced)"
        rule: "13-15hcp, balanced, 3-h, 3-s"
        priority: 2
