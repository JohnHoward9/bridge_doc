        desc: "Jacoby 2NT: Game forcing with 4+ Hearts (13+ HCP)"
        rule: "p#1 13+hcp 4+h [$M=h, $OM=s]"
        priority: 1
        ref: "fJacoby2NT"

      3d:
        desc: "Limit raise: 4+ Hearts, 10-11 HCP (invitational)"
