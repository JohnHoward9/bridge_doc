library: "Gavin Wolpert 5-Card Majors & 2/1 GF"
description: "Gavin Wolpert Major suit structure: 2D shows 5+, 2M rebid shows 6, Semi-Forcing 1NT, Jacoby 2NT, Mixed Raise (1x-3x), and Splinters"
version: "2.0"

imports:
  - "assets/libraries/conventions/reversed_bart.yaml"
  - "assets/libraries/conventions/jacoby_2nt.yaml"
  - "assets/libraries/conventions/two_way_checkback.yaml"
  - "assets/libraries/conventions/rkcb_1430.yaml"
  - "assets/libraries/conventions/serious_3nt_and_kickback.yaml"
  - "assets/libraries/conventions/major_interference_defense.yaml"
  - "assets/libraries/conventions/fourth_suit_forcing.yaml"
  - "assets/libraries/conventions/transfers_after_one_major_double.yaml"
  - "assets/libraries/conventions/exclusion_rkcb.yaml"
  - "assets/libraries/conventions/support_doubles.yaml"
  - "assets/libraries/conventions/suit_overcalls_and_michaels.yaml"

fragments:
  GavinHeartOpening:
    aliases:
      - "fGavinHeartResponses"
      - "fGavinMajors1HResponses"
    desc: "Gavin 5+ Hearts opening (12+ HCP)"
    rule: "12+hcp 5+h h>s [$M=h, $OM=s]"
    ref: "Gavin1H1SOpening"
    bids:
      "(x)":
        desc: "Transfers after 1H - (X)"
        ref: "fTransfersAfter1H_Double"
      "(1s)":
        desc: "Opponent 1S overcall over 1H"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double (8+ HCP, minor length or balanced without 3-card Heart support)"
            rule: "8+hcp 3-s 2-h"
            priority: 1
          1nt:
            desc: "Natural 1NT with Spade stopper (8-10 HCP)"
            rule: "8-10hcp n#a|k|qs"
            priority: 3
          2h:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3h"
            priority: 2
          2s:
            desc: "Cuebid of opponent's Spade suit: Limit raise or better in Hearts (10+ HCP, 3+ Hearts)"
            rule: "10+hcp 3+h"
            priority: 1
          "[2c,2d]":
            desc: "Natural non-forcing 5+ minor (8-11 HCP)"
            rule: "8-11hcp 5+%"
            priority: 3
          2nt:
            desc: "Natural 2NT invitational with Spade stopper (11-12 HCP)"
            rule: "11-12hcp n#a|k|qs"
            priority: 2
          3h:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+h"
            priority: 2
          4h:
            desc: "LoTT game raise / preemptive (5+ card support, 0-9 HCP or 10+ HCP)"
            rule: "5+h"
            priority: 1
      "(2c)":
        desc: "Opponent 2C overcall over 1H"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double: Exactly 4 Spades (8+ HCP)"
            rule: "8+hcp 4=s"
            priority: 1
          2d:
            desc: "Natural 5+ Diamonds (8+ HCP)"
            rule: "8+hcp 5+d"
            priority: 2
          2h:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3h"
            priority: 2
          2s:
            desc: "Natural 5+ Spades (8+ HCP)"
            rule: "8+hcp 5+s"
            priority: 1
          2nt:
            desc: "Natural with Club stopper (10-12 HCP)"
            rule: "10-12hcp n#a|k|qc"
            priority: 2
          3c:
            desc: "Cuebid of opponent's Club suit: Limit raise or better in Hearts (10+ HCP, 3+ Hearts)"
            rule: "10+hcp 3+h"
            priority: 1
          3h:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+h"
            priority: 2
          4h:
            desc: "LoTT game raise (5+ Hearts)"
            rule: "5+h"
            priority: 1
      "(2d)":
        desc: "Opponent 2D overcall over 1H"
        bids:
          pass:
            desc: "Pass (0-7 HCP)"
            rule: "0-7hcp"
            priority: 10
          dbl:
            desc: "Negative Double: Exactly 4 Spades (8+ HCP)"
            rule: "8+hcp 4=s"
            priority: 1
          2h:
            desc: "LoTT simple competitive raise (3-card support, 6-9 HCP)"
            rule: "6-9hcp 3h"
            priority: 2
          2s:
            desc: "Natural 5+ Spades (8+ HCP)"
            rule: "8+hcp 5+s"
            priority: 1
          2nt:
            desc: "Natural with Diamond stopper (10-12 HCP)"
            rule: "10-12hcp n#a|k|qd"
            priority: 2
          3d:
            desc: "Cuebid of opponent's Diamond suit: Limit raise or better in Hearts (10+ HCP, 3+ Hearts)"
            rule: "10+hcp 3+h"
            priority: 1
          3h:
            desc: "LoTT preemptive jump raise (4-card support, 5-9 HCP)"
            rule: "5-9hcp 4+h"
            priority: 2
          4h:
            desc: "LoTT game raise (5+ Hearts)"
            rule: "5+h"
            priority: 1
      "(2nt)":
        desc: "Opponent Unusual 2NT over 1H (showing minors 5-5)"
        ref: "fUnusualOverUnusual_Hearts"
      "(2h)":
        desc: "Opponent Michaels Cuebid over 1H (showing Spades + minor 5-5)"
        ref: "fMichaelsDefense_Major"

  GavinSpadeOpening:
    aliases:
